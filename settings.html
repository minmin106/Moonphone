<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Settings</title>
  <style>
    /* ---------------- CSS Variables (Apple iOS System Colors) ---------------- */
    :root {
      --bg-system: #000000;
      --bg-grouped: #1c1c1e;
      --bg-active: #2c2c2e;
      --bg-input: transparent;
      
      --text-primary: #ffffff;
      --text-secondary: #8e8e93;
      --text-tertiary: #636366;
      --text-placeholder: #48484a;
      --text-disabled: #545458;
      
      --separator: rgba(84, 84, 88, 0.42);
      --chevron-color: #8e8e93;
      
      /* Apple System Accent Colors */
      --accent-blue: #0a84ff;
      --accent-green: #34c759;
      --accent-red: #ff453a;
      --accent-yellow: #ffd60a;
      --badge-teal: #64d2ff;
      --badge-purple: #bf5af2;
      --badge-indigo: #5e5ce6;
      --badge-gray: #3a3a3c;

      /* iOS Sliding Switch */
      --switch-on: #34c759;
      --switch-off: #39393d;
      --switch-knob: #ffffff;

      /* Radiuses */
      --radius-grouped: 12px;
      --radius-icon: 7px;
      --radius-switch: 16px;
      --radius-btn: 12px;
      
      --transition-tap: background-color 0.15s ease;
    }

    /* ---------------- Global Reset & Base Setup ---------------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-system);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .settings-container {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 56px;
    }

    /* ---------------- Top Navigation Bar ---------------- */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background-color: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .nav-back-btn {
      display: flex;
      align-items: center;
      background: none;
      border: none;
      color: var(--accent-blue);
      cursor: pointer;
      padding: 6px 0;
      transition: opacity 0.2s;
    }

    .nav-back-btn:active {
      opacity: 0.6;
    }

    .nav-title {
      font-size: 17px;
      font-weight: 600;
      text-align: center;
      flex: 1;
      margin-right: 28px; /* Balance left chevron width */
    }

    /* ---------------- Grouped List Layout ---------------- */
    .section-header {
      font-size: 13px;
      font-weight: 400;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin: 22px 16px 7px 16px;
      letter-spacing: -0.05px;
    }

    .grouped-card {
      background-color: var(--bg-grouped);
      border-radius: var(--radius-grouped);
      margin: 0 16px;
      overflow: hidden;
    }

    /* ---------------- List Item Rows ---------------- */
    .setting-item {
      display: flex;
      align-items: center;
      min-height: 48px;
      padding: 0 16px;
      position: relative;
      cursor: pointer;
      transition: var(--transition-tap);
      user-select: none;
    }

    /* Pressing feedback */
    .setting-item:active {
      background-color: var(--bg-active);
    }

    /* iOS Inset separator */
    .setting-item:not(:last-child)::after {
      content: "";
      position: absolute;
      bottom: 0;
      right: 0;
      left: 54px;
      height: 0.5px;
      background-color: var(--separator);
    }

    /* Icon Badge with Minimalist Linear SVG */
    .item-icon-badge {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-icon);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      flex-shrink: 0;
      color: #ffffff;
    }

    /* Icon Badge Background Themes */
    .badge-wallpaper { background-color: var(--badge-teal); }
    .badge-sound     { background-color: var(--accent-red); }
    .badge-imessage  { background-color: var(--accent-green); }
    .badge-kakao     { background-color: var(--accent-yellow); color: #000000; }
    .badge-weather   { background-color: var(--accent-blue); }
    .badge-schedule  { background-color: var(--badge-purple); }
    .badge-ai-url    { background-color: var(--badge-indigo); }
    .badge-ai-key    { background-color: #ff9f0a; }
    .badge-ai-model  { background-color: #30d158; }
    .badge-about     { background-color: var(--badge-gray); }

    .item-label {
      font-size: 16px;
      font-weight: 400;
      color: var(--text-primary);
      flex: 1;
      letter-spacing: -0.2px;
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .item-detail-text {
      font-size: 16px;
      color: var(--text-secondary);
      letter-spacing: -0.2px;
    }

    .chevron-icon {
      color: var(--chevron-color);
      display: flex;
      align-items: center;
    }

    /* ---------------- Native iOS Sliding Switch (Toggle) ---------------- */
    .switch-row {
      cursor: default;
    }

    .ios-switch {
      position: relative;
      display: inline-block;
      width: 51px;
      height: 31px;
      flex-shrink: 0;
    }

    .ios-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background-color: var(--switch-off);
      border-radius: var(--radius-switch);
      transition: background-color 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .slider::before {
      position: absolute;
      content: "";
      height: 27px;
      width: 27px;
      left: 2px;
      bottom: 2px;
      background-color: var(--switch-knob);
      border-radius: 50%;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3), 0 1px 1px rgba(0, 0, 0, 0.16);
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .ios-switch input:checked + .slider {
      background-color: var(--switch-on);
    }

    .ios-switch input:checked + .slider::before {
      transform: translateX(20px);
    }

    /* ---------------- AI Configuration Input Fields ---------------- */
    .input-row {
      cursor: text;
    }

    .input-row .item-label {
      flex: 0 0 95px;
    }

    .ios-field-input, .ios-field-select {
      flex: 1;
      width: 100%;
      background: var(--bg-input);
      border: none;
      outline: none;
      font-size: 16px;
      color: var(--text-primary);
      text-align: right;
      letter-spacing: -0.2px;
    }

    .ios-field-input::placeholder {
      color: var(--text-placeholder);
    }

    .ios-field-select {
      cursor: pointer;
      direction: rtl;
      -webkit-appearance: none;
      appearance: none;
    }

    .ios-field-select option {
      background-color: #242426;
      color: #ffffff;
      direction: ltr;
    }

    /* Save Configuration Action Button */
    .save-btn-container {
      margin: 16px 16px 0 16px;
    }

    .btn-save-config {
      width: 100%;
      height: 48px;
      background-color: var(--accent-blue);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-btn);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.18s ease, transform 0.1s ease;
    }

    .btn-save-config:active {
      opacity: 0.75;
      transform: scale(0.985);
    }

    /* ---------------- Part IV: About & Disabled Item ---------------- */
    .setting-item.disabled-item {
      cursor: default;
    }

    .setting-item.disabled-item:active {
      background-color: var(--bg-grouped); /* No active flash for disabled */
    }

    .setting-item.disabled-item .item-label {
      color: var(--text-disabled);
    }
  </style>
</head>
<body>

  <div class="settings-container">
    <!-- Top Navigation Bar -->
    <header class="nav-bar">
      <!-- Return Button (<) -->
      <button class="nav-back-btn" onclick="handleBackAction()" aria-label="Go Back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <h1 class="nav-title">Settings</h1>
    </header>

    <!-- Part I: Personalized Settings -->
    <section>
      <div class="section-header">Personalized Settings</div>
      <div class="grouped-card">
        <!-- Wallpaper -->
        <div class="setting-item" onclick="handleItemClick('Wallpaper')">
          <div class="item-icon-badge badge-wallpaper">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
          </div>
          <span class="item-label">Wallpaper</span>
          <div class="item-right">
            <span class="item-detail-text">Current Wallpaper</span>
            <span class="chevron-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </span>
          </div>
        </div>

        <!-- Reminder sound -->
        <div class="setting-item" onclick="handleItemClick('Reminder sound')">
          <div class="item-icon-badge badge-sound">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          </div>
          <span class="item-label">Reminder sound</span>
          <div class="item-right">
            <span class="item-detail-text">Default</span>
            <span class="chevron-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </span>
          </div>
        </div>
      </div>
    </section>

    <!-- Part II: System and Reminder -->
    <section>
      <div class="section-header">System and Reminder</div>
      <div class="grouped-card">
        <!-- iMessage reminder -->
        <div class="setting-item switch-row">
          <div class="item-icon-badge badge-imessage">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
          </div>
          <span class="item-label">iMessage reminder</span>
          <label class="ios-switch">
            <input type="checkbox" checked onchange="handleToggleChange('iMessage', this.checked)">
            <span class="slider"></span>
          </label>
        </div>

        <!-- KakaoTalk reminder -->
        <div class="setting-item switch-row">
          <div class="item-icon-badge badge-kakao">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
          </div>
          <span class="item-label">KakaoTalk reminder</span>
          <label class="ios-switch">
            <input type="checkbox" checked onchange="handleToggleChange('KakaoTalk', this.checked)">
            <span class="slider"></span>
          </label>
        </div>

        <!-- Weather reminder -->
        <div class="setting-item switch-row">
          <div class="item-icon-badge badge-weather">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v2M4.93 4.93l1.41 1.41M20 12h2M17.66 17.66l1.41 1.41M2 12h2M6.34 17.66l-1.41 1.41"></path>
              <path d="M17.5 17.5A5 5 0 1 0 9 12a5 5 0 0 0 0 6h8.5a3.5 3.5 0 0 0 0-7h-.5"></path>
            </svg>
          </div>
          <span class="item-label">Weather reminder</span>
          <label class="ios-switch">
            <input type="checkbox" onchange="handleToggleChange('Weather', this.checked)">
            <span class="slider"></span>
          </label>
        </div>

        <!-- Schedule reminder -->
        <div class="setting-item switch-row">
          <div class="item-icon-badge badge-schedule">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </div>
          <span class="item-label">Schedule reminder</span>
          <label class="ios-switch">
            <input type="checkbox" checked onchange="handleToggleChange('Schedule', this.checked)">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </section>

    <!-- Part III: AI Core Configuration (Key Points) -->
    <section>
      <div class="section-header">AI Core Configuration</div>
      <div class="grouped-card">
        <!-- API URL -->
        <div class="setting-item input-row">
          <div class="item-icon-badge badge-ai-url">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
          </div>
          <span class="item-label">API URL</span>
          <input type="url" class="ios-field-input" id="apiUrlInput" placeholder="https://api.openai.com/v1...">
        </div>

        <!-- API Key -->
        <div class="setting-item input-row">
          <div class="item-icon-badge badge-ai-key">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 2l-2 2m-1.5 1.5L14 9l-1.5-1.5L11 9l-1.5-1.5L8 9l-1.5-1.5L2 12l5 5 12-12-1.5-1.5z"></path>
              <circle cx="7.5" cy="16.5" r="1.5"></circle>
            </svg>
          </div>
          <span class="item-label">API Key</span>
          <input type="password" class="ios-field-input" id="apiKeyInput" placeholder="••••••••••••••••">
        </div>

        <!-- Model Selection -->
        <div class="setting-item">
          <div class="item-icon-badge badge-ai-model">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
            </svg>
          </div>
          <span class="item-label">Model</span>
          <div class="item-right" style="flex: 1; justify-content: flex-end;">
            <select class="ios-field-select" id="modelSelect">
              <option value="gpt-4o" selected>gpt-4o</option>
              <option value="gpt-4o-mini">gpt-4o-mini</option>
              <option value="o1">o1</option>
              <option value="claude-3-5-sonnet">claude-3-5-sonnet</option>
              <option value="deepseek-r1">deepseek-r1</option>
            </select>
            <span class="chevron-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </span>
          </div>
        </div>
      </div>

      <!-- Save Configuration Button -->
      <div class="save-btn-container">
        <button class="btn-save-config" onclick="saveConfiguration()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          Save Configuration
        </button>
      </div>
    </section>

    <!-- Part IV: About -->
    <section>
      <div class="section-header">About</div>
      <div class="grouped-card">
        <div class="setting-item disabled-item">
          <div class="item-icon-badge badge-about">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
          </div>
          <span class="item-label">More advanced functions, please look forward to it</span>
        </div>
      </div>
    </section>
  </div>

  <script>
    /* ---------------- Navigation Back Feedback ---------------- */
    function handleBackAction() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        alert("Returning to Home Screen...");
      }
    }

    /* ---------------- List Item Interaction ---------------- */
    function handleItemClick(title) {
      alert(`Opening ${title}...`);
    }

    /* ---------------- Switch Toggle Handler ---------------- */
    function handleToggleChange(name, isChecked) {
      console.log(`[Setting] ${name} reminder set to: ${isChecked ? 'ON' : 'OFF'}`);
    }

    /* ---------------- Save AI Configuration ---------------- */
    function saveConfiguration() {
      const apiUrl = document.getElementById('apiUrlInput').value;
      const apiKey = document.getElementById('apiKeyInput').value;
      const model = document.getElementById('modelSelect').value;

      console.log('Saved Configuration:', { apiUrl, hasApiKey: Boolean(apiKey), model });
      alert('configuration has been saved!');
    }
  </script>
</body>
</html>
