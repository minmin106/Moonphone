<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>iOS Liquid Glass Desktop</title>
  <style>
    /* ==========================================================================
       CSS VARIABLES & LIQUID GLASS SPECIFICATIONS
       ========================================================================== */
    :root {
      /* Translucent Liquid Glass Materials */
      --glass-bg-base: rgba(255, 255, 255, 0.16);
      --glass-bg-hover: rgba(255, 255, 255, 0.28);
      --glass-dock-bg: rgba(255, 255, 255, 0.2);
      --glass-widget-bg: rgba(255, 255, 255, 0.22);

      /* Specular Edges & Borders */
      --glass-border: rgba(255, 255, 255, 0.42);
      --glass-border-subtle: rgba(255, 255, 255, 0.2);
      --glass-inner-highlight: inset 0 1px 1px rgba(255, 255, 255, 0.7),
                               inset 0 -1px 1px rgba(255, 255, 255, 0.15);

      /* Blur Engine */
      --blur-surface: blur(30px) saturate(180%);
      --blur-dock: blur(36px) saturate(200%);

      /* Ambient Shadows */
      --shadow-tile: 0 8px 24px -4px rgba(20, 24, 38, 0.06),
                     0 2px 6px -1px rgba(20, 24, 38, 0.03);
      --shadow-widget: 0 12px 28px -6px rgba(20, 24, 38, 0.1),
                       0 3px 8px -2px rgba(20, 24, 38, 0.05);
      --shadow-dock: 0 18px 42px -6px rgba(20, 24, 38, 0.1),
                     0 2px 6px rgba(0, 0, 0, 0.03);

      /* Typography & Strokes */
      --text-primary: rgba(18, 22, 30, 0.88);
      --text-secondary: rgba(18, 22, 30, 0.55);
      --accent-color: #0071e3;
      --icon-stroke-color: rgba(22, 26, 35, 0.82);

      /* Geometry & Scaling */
      --icon-size: clamp(56px, 7vw, 66px);
      --icon-radius: clamp(16px, 2vw, 19px);
      --widget-radius: clamp(20px, 3vw, 24px);
      --dock-radius: clamp(26px, 3.5vw, 36px);
      --grid-gap: clamp(16px, 2.8vw, 24px);

      /* Transitions */
      --ease-liquid: cubic-bezier(0.16, 1, 0.3, 1);
      --transition-fast: 0.22s var(--ease-liquid);
    }

    /* Base Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
                   "Helvetica Neue", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background-color: #e2e6eb;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ambient Background Orbs */
    .ambient-background {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: linear-gradient(135deg, #e4ebf3 0%, #d5e0ec 50%, #dce5ec 100%);
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.58;
    }

    .orb-1 {
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(168, 198, 232, 0.7) 0%, rgba(180, 215, 245, 0) 70%);
      top: -80px;
      right: -60px;
    }

    .orb-2 {
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(235, 208, 222, 0.6) 0%, rgba(235, 210, 225, 0) 70%);
      bottom: -40px;
      left: -80px;
    }

    .orb-3 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(198, 228, 222, 0.5) 0%, rgba(198, 228, 222, 0) 70%);
      top: 35%;
      left: 28%;
    }

    /* ==========================================================================
       VIEWPORT (WITH DYNAMIC ISLAND / NOTCH SAFE OFFSET)
       ========================================================================== */
    .desktop-viewport {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(calc(env(safe-area-inset-top) + 14px), 36px) 
               env(safe-area-inset-right, 16px) 
               env(safe-area-inset-bottom, 8px) 
               env(safe-area-inset-left, 16px);
      max-width: 1280px;
      margin: 0 auto;
    }

    /* ==========================================================================
       APP GRID CONTAINER & WIDGET ARCHITECTURE
       ========================================================================== */
    .app-grid-container {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 6px 0 16px 0;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .app-grid-container::-webkit-scrollbar {
      display: none;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--grid-gap);
      padding: 8px 16px 20px 16px;
      max-width: 460px;
      width: 100%;
      margin: 0 auto;
      align-items: start;
    }

    /* ---------------- Liquid Glass Widgets (2x2 Spanning) ---------------- */
    .widget-card {
      grid-column: span 2;
      aspect-ratio: 1 / 1;
      border-radius: var(--widget-radius);
      background: var(--glass-widget-bg);
      backdrop-filter: var(--blur-surface);
      -webkit-backdrop-filter: var(--blur-surface);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-widget), var(--glass-inner-highlight);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
      -webkit-tap-highlight-color: transparent;
    }

    /* Tactile Pressing Feedback */
    .widget-card:hover {
      box-shadow: 0 14px 32px -4px rgba(20, 24, 38, 0.14), var(--glass-inner-highlight);
    }

    .widget-card:active {
      transform: scale(0.95);
      box-shadow: 0 6px 18px -4px rgba(20, 24, 38, 0.12), var(--glass-inner-highlight);
    }

    .widget-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 48%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0) 100%);
      border-radius: var(--widget-radius) var(--widget-radius) 0 0;
      pointer-events: none;
      z-index: 3;
    }

    /* 1. Photo Widget */
    .widget-photo {
      background: linear-gradient(150deg, #d8b4e2 0%, #fbc2eb 40%, #a6c1ee 100%);
      padding: 12px;
      justify-content: space-between;
    }

    .photo-svg-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .widget-tag-pill {
      position: relative;
      z-index: 4;
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      border-radius: 99px;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.95);
      background: rgba(18, 22, 35, 0.28);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .widget-photo-caption {
      position: relative;
      z-index: 4;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      line-height: 1.25;
    }

    .photo-caption-title {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .photo-caption-sub {
      font-size: 0.68rem;
      opacity: 0.88;
    }

    /* 2. Music Widget */
    .widget-music {
      background: var(--glass-widget-bg);
      padding: 12px;
      justify-content: space-between;
    }

    .music-widget-top {
      display: flex;
      gap: 10px;
      align-items: center;
      position: relative;
      z-index: 4;
    }

    .album-art-tile {
      width: 44px;
      height: 44px;
      border-radius: 11px;
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 50%, #7963e0 100%);
      box-shadow: 0 4px 12px rgba(255, 117, 140, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      flex-shrink: 0;
    }

    .music-meta {
      flex: 1;
      min-width: 0;
    }

    .music-tag {
      font-size: 0.62rem;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--accent-color);
      display: block;
      margin-bottom: 2px;
    }

    .music-title {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .music-artist {
      font-size: 0.68rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Music Progress Bar */
    .music-progress-track {
      height: 3px;
      background: rgba(0, 0, 0, 0.06);
      border-radius: 99px;
      position: relative;
      overflow: hidden;
      margin: 6px 0;
      z-index: 4;
    }

    .music-progress-fill {
      width: 48%;
      height: 100%;
      background: var(--accent-color);
      border-radius: 99px;
    }

    /* Minimalist Playback Controls */
    .music-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 4;
      padding: 0 4px;
    }

    .music-ctrl-btn {
      background: none;
      border: none;
      outline: none;
      color: var(--icon-stroke-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: transform var(--transition-fast);
    }

    .music-ctrl-btn:active {
      transform: scale(0.85);
    }

    .btn-play-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      color: var(--text-primary);
    }

    /* ---------------- App Grid Items (15 Apps) ---------------- */
    .app-item {
      text-decoration: none;
      color: inherit;
      background: none;
      border: none;
      outline: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      transition: transform var(--transition-fast);
    }

    .app-item:active {
      transform: scale(0.92);
    }

    .icon-tile {
      width: var(--icon-size);
      height: var(--icon-size);
      border-radius: var(--icon-radius);
      background: var(--glass-bg-base);
      backdrop-filter: var(--blur-surface);
      -webkit-backdrop-filter: var(--blur-surface);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-tile), var(--glass-inner-highlight);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--icon-stroke-color);
      position: relative;
      overflow: hidden;
      transition: background var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .icon-tile::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 44%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.42) 0%, rgba(255, 255, 255, 0) 100%);
      border-radius: var(--icon-radius) var(--icon-radius) 0 0;
      pointer-events: none;
    }

    .app-item:hover .icon-tile,
    .dock-item:hover .icon-tile {
      background: var(--glass-bg-hover);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 0 10px 26px -3px rgba(20, 24, 38, 0.09), var(--glass-inner-highlight);
    }

    /* Strict Minimalist Linear App SVG Rules */
    .app-svg {
      width: 50%;
      height: 50%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
      position: relative;
      z-index: 1;
    }

    .app-label {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
      white-space: nowrap;
      pointer-events: none;
    }

    /* ==========================================================================
       BOTTOM DOCK
       ========================================================================== */
    .dock-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding-bottom: 6px;
    }

    .dock-glass {
      background: var(--glass-dock-bg);
      backdrop-filter: var(--blur-dock);
      -webkit-backdrop-filter: var(--blur-dock);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-dock), var(--glass-inner-highlight);
      border-radius: var(--dock-radius);
      padding: clamp(10px, 1.6vw, 15px);
      display: flex;
      align-items: center;
      gap: clamp(12px, 2.2vw, 24px);
      position: relative;
      overflow: hidden;
    }

    .dock-glass::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 48%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.38) 0%, rgba(255, 255, 255, 0) 100%);
      border-radius: var(--dock-radius) var(--dock-radius) 0 0;
      pointer-events: none;
    }

    .dock-item {
      text-decoration: none;
      color: inherit;
      background: none;
      border: none;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform var(--transition-fast);
    }

    .dock-item:active {
      transform: scale(0.9);
    }

    .home-indicator {
      width: 132px;
      height: 4px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 99px;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- Ambient Dynamic Lighting -->
  <div class="ambient-background">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <!-- Fullscreen Desktop Shell -->
  <main class="desktop-viewport">

    <!-- Unified Application Grid: 2 Widgets (2x2) + 15 App Icons -->
    <section class="app-grid-container">
      <div class="app-grid">

        <!-- ==================== WIDGET 1: PHOTO WIDGET (2x2) ==================== -->
        <a class="widget-card widget-photo" href="photos.html" title="Open Photos Album">
          <!-- Minimalist Vector Landscape SVG -->
          <svg class="photo-svg-art" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice" fill="none">
            <!-- Sky Gradient Wash -->
            <defs>
              <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#fdcbf1" stop-opacity="0.7"/>
                <stop offset="50%" stop-color="#e6c8ea" stop-opacity="0.8"/>
                <stop offset="100%" stop-color="#8ec5fc" stop-opacity="0.9"/>
              </linearGradient>
              <linearGradient id="mtnGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#9370db" stop-opacity="0.75"/>
                <stop offset="100%" stop-color="#5a428e" stop-opacity="0.9"/>
              </linearGradient>
              <linearGradient id="mtnGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#e0c3fc" stop-opacity="0.85"/>
                <stop offset="100%" stop-color="#8ec5fc" stop-opacity="0.95"/>
              </linearGradient>
            </defs>
            <rect width="200" height="200" fill="url(#skyGrad)"/>
            <!-- Radiant Sun -->
            <circle cx="140" cy="65" r="24" fill="#ffffff" fill-opacity="0.85"/>
            <!-- Distant Mountain -->
            <path d="M50 200 L110 95 L170 200 Z" fill="url(#mtnGrad1)"/>
            <!-- Foreground Peak & Valleys -->
            <path d="M-20 200 L45 120 L130 200 Z" fill="url(#mtnGrad2)"/>
            <path d="M90 200 L155 130 L230 200 Z" fill="#7a88cf" fill-opacity="0.75"/>
            <!-- Gentle Birds -->
            <path d="M55 58 Q60 54 65 58 Q70 54 75 58" stroke="rgba(255,255,255,0.8)" stroke-width="1.3" fill="none"/>
            <path d="M78 68 Q82 65 86 68 Q90 65 94 68" stroke="rgba(255,255,255,0.7)" stroke-width="1.1" fill="none"/>
          </svg>

          <!-- Top Badge -->
          <div class="widget-tag-pill">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            <span>Memories</span>
          </div>

          <!-- Bottom Caption -->
          <div class="widget-photo-caption">
            <div class="photo-caption-title">Lake Solitude</div>
            <div class="photo-caption-sub">Updated today</div>
          </div>
        </a>

        <!-- ==================== WIDGET 2: MUSIC WIDGET (2x2) ==================== -->
        <a class="widget-card widget-music" href="music.html" title="Open Music">
          <!-- Top Area: Cover + Title -->
          <div class="music-widget-top">
            <div class="album-art-tile">
              <!-- Minimal Vinyl / Sound Wave SVG -->
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"/>
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 3v3M12 18v3"/>
              </svg>
            </div>
            <div class="music-meta">
              <span class="music-tag">AI Recommended</span>
              <div class="music-title" id="music-track-title">AI Recommended Song List</div>
              <div class="music-artist">Neural Ambience • Flow</div>
            </div>
          </div>

          <!-- Middle Progress Indicator -->
          <div class="music-progress-track">
            <div class="music-progress-fill"></div>
          </div>

          <!-- Bottom: Minimalist Linear Playback Controls -->
          <div class="music-controls">
            <!-- Previous Button -->
            <button class="music-ctrl-btn" aria-label="Previous">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="19 20 9 12 19 4 19 20"/>
                <line x1="5" y1="19" x2="5" y2="5"/>
              </svg>
            </button>

            <!-- Play / Pause Toggle Circle -->
            <button class="music-ctrl-btn btn-play-circle" id="btn-toggle-play" aria-label="Play/Pause">
              <svg id="play-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="7 4 19 12 7 20 7 4"/>
              </svg>
            </button>

            <!-- Next Button -->
            <button class="music-ctrl-btn" aria-label="Next">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 4 15 12 5 20 5 4"/>
                <line x1="19" y1="5" x2="19" y2="19"/>
              </svg>
            </button>
          </div>
        </a>

        <!-- ==================== 15 APP ICONS (NEAT 4-COLUMN FLOW) ==================== -->
        <!-- 1. Weather -->
        <a class="app-item" href="weather.html" data-app-id="weather" data-title="Weather">
          <div class="icon-tile">
            <svg class="app-svg" viewBox="0 0 24 24">
              <path d="M16 16.5a3.8 3.8 0 0 0 .5-7.5 4.8 4.8 0 0 0-9.2-1.2A3.8 3.8 0 0 0 7 16.5z"/>
              <line x1="12" y1="2.5" x2="12" y2="4"/>
              <line x1="18.5" y1="5.2" x2="17.4" y2="6.3"/>
              <line x1="5.5" y1="5.2" x2="6.6" y2="6.3"/>
            </svg>
          </div>
          <span class="app-label">Weather</span>
        </a>

        <!-- 2. Calendar -->
        <a class="app-item" href="calendar.html" data-app-id="calendar" data-title="Calendar">
          <div class="icon-tile">
            <svg class="app-svg" viewBox="0 0 24 24">
              <rect x="3.5" y="5" width="17" height="15" rx="3.5"/>
              <line x1="3.5" y1="9.5" x2="20.5" y2="9.5"/>
              <line x1="8" y1="3" x2="8" y2="6"/>
              <line x1="16" y1="3" x2="16" y2="6"/>
              <circle cx="8" cy="13" r="0.75"/>
              <circle cx="12" cy="13" r="0.75"/>
              <circle cx="16" cy="13" r="0.75"/>
              <circle cx="8" cy="16.5" r="0.75"/>
              <circle cx="12" cy="16.5" r="0.75"/>
            </svg>
          </div>
          <span class="app-label">Calendar</span>
        </a>

        <!-- 3. Reminders -->
        <a class="app-item" href="reminders.html" data-app-id="reminders" data-title="Reminders">
          <div class="icon-tile">
            <svg class="app-svg" viewBox="0 0 24 24">
              <circle cx="6" cy="7" r="1.6"/>
              <line x1="10.5" y1="7" x2="19.5" y2="7"/>
              <circle cx="6" cy="12" r="1.6"/>
              <line x1="10.5" y1="12" x2="19.5" y2="12"/>
              <circle cx="6" cy="17" r="1.6"/>
              <line x1="10.5" y1="17" x2="19.5" y2="17"/>
            </svg>
          </div>
          <span class="app-label">Reminders</span>
        </a>

        <!-- 4. Memo -->
        <a class="app-item" href="notes.html" data-app-id="notes" data-title="Memo">
          <div class="icon-tile">
            <svg class="app-svg" viewBox="0 0 24 24">
              <path d="M5.5 4.5h8.5l4.5 4.5V19a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2z"/>
              <polyline points="14,4.5 14,9 18.5,9"/>
              <line x1="8" y1="13" x2="14" y2="13"/>
              <line x1="8" y1="16.5" x2="12" y2="16.5"/>
            </svg>
          </div>
          <span class="app-label">Memo</span>

  <script>
    /**
     * Minimal Music Widget Play/Pause Toggle
     */
    document.addEventListener("DOMContentLoaded", () => {
      const btnPlay = document.getElementById("btn-toggle-play");
      const playIcon = document.getElementById("play-icon");
      const ctrlButtons = document.querySelectorAll(".music-ctrl-btn");
      let isPlaying = false;

      // Prevent playback buttons from triggering the outer anchor navigation
      ctrlButtons.forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
        });
      });

      if (btnPlay && playIcon) {
        btnPlay.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          isPlaying = !isPlaying;

          if (isPlaying) {
            playIcon.innerHTML = `
              <rect x="6" y="4" width="4" height="16" rx="1"/>
              <rect x="14" y="4" width="4" height="16" rx="1"/>
            `;
          } else {
            playIcon.innerHTML = `
              <polygon points="7 4 19 12 7 20 7 4"/>
            `;
          }
        });
      }
    });
  </script>
