<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minimal Phone</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 0px; }
        
        body { margin: 0; padding: 0; height: 100vh; overflow: hidden; background-color: #000; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }

        /* 手机全屏 */
        #phone { width: 100vw; height: 100vh; position: relative; overflow: hidden; background: linear-gradient(180deg, #e6e6e6 0%, #a8a8a8 100%); transition: background 0.3s; }

        /* 亮度遮罩 (修复版) */
        #brightness-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; opacity: 0; pointer-events: none; z-index: 9999; transition: opacity 0.1s; }

        /* 状态栏 */
        .status-bar { position: absolute; top: 10px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 25px; color: #333; font-size: 14px; font-weight: 600; z-index: 100; pointer-events: none; }
        .battery-icon { width: 22px; height: 11px; border: 1px solid currentColor; border-radius: 3px; position: relative; padding: 1px; display:inline-block; vertical-align: middle;}
        .battery-icon::after { content: ''; position: absolute; right: -3px; top: 2px; width: 2px; height: 5px; background: currentColor; border-radius: 0 1px 1px 0; }
        .battery-level { height: 100%; width: 73%; background: currentColor; border-radius: 1px; }

        /* 桌面 */
        #home-screen { width: 100%; height: 100%; padding: 60px 25px 20px; display: flex; flex-direction: column; z-index: 1; }
        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; margin-top: 30px; }
        .app-icon { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: transform 0.2s; }
        .app-icon:active { transform: scale(0.85); }
        .app-name { font-size: 11px; color: #333; font-weight: 500; text-shadow: 0 1px 2px rgba(255,255,255,0.5);}
        
        .icon-kakao { width: 60px; height: 60px; border-radius: 22%; background: #FEE500; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .kakao-bubble { width: 40px; height: 32px; background: #3C1E1E; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #FEE500; font-weight: 900; font-size: 12px; position: relative;}
        .kakao-bubble::after { content: ''; position: absolute; bottom: -4px; left: 10px; border-width: 6px 8px 0 0; border-style: solid; border-color: #3C1E1E transparent transparent transparent; transform: rotate(-15deg); }

        .icon-settings { width: 60px; height: 60px; border-radius: 22%; background: linear-gradient(180deg, #d4d4d4 0%, #8c8c8c 100%); display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .settings-gear { width: 40px; height: 40px; fill: #555; }

        .dock { margin-top: auto; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(25px); border-radius: 35px; padding: 15px 20px; display: flex; justify-content: center; gap: 40px; }

        /* App 页面容器 */
        .app-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; z-index: 200; opacity: 0; transform: scale(0.2); transition: opacity 0.3s, transform 0.35s; background: #000; }
        .app-screen.active { display: flex; opacity: 1; transform: scale(1); }

        /* ================= KakaoTalk ================= */
        #app-kakao { background: #000; color: #fff; }
        .kakao-header { padding: 55px 20px 10px; display: flex; justify-content: space-between; align-items: center; }
        .kakao-header h1 { font-size: 22px; font-weight: 600; }
        .header-icons { display: flex; gap: 18px; font-size: 20px; cursor: pointer; }
        
        .pill-container { display: flex; gap: 8px; padding: 10px 20px; overflow-x: auto; }
        .pill { padding: 6px 14px; border-radius: 20px; background: #2c2c2e; color: #888; font-size: 14px; cursor: pointer; }
        .pill.active { background: #fff; color: #000; font-weight: 600; }

        .kakao-list { flex: 1; overflow-y: auto; }
        .kakao-item { display: flex; padding: 15px 20px; align-items: center; gap: 15px; cursor: pointer; }
        .kakao-item:active { background: #111; }
        .kakao-avatar { width: 50px; height: 50px; border-radius: 18px; background: #FEE500; display: flex; justify-content: center; align-items: center; font-size: 24px; color: #3C1E1E; font-weight: bold; flex-shrink: 0;}
        .kakao-info { flex: 1; overflow: hidden; }
        .kakao-name { font-size: 15px; margin-bottom: 4px; }
        .kakao-preview { font-size: 13px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .kakao-meta { text-align: right; font-size: 12px; color: #888; align-self: flex-start; margin-top: 4px;}

        .kakao-bottom-nav { position: absolute; bottom: 0; width: 100%; height: 80px; background: #111; display: flex; justify-content: space-around; padding-top: 15px; border-top: 1px solid #222;}
        .nav-item { color: #555; font-size: 24px; cursor: pointer; }
        .nav-item.active { color: #fff; }

        /* 细箭头返回键 */
        .thin-back { font-size: 32px; font-weight: 300; line-height: 1; padding-right: 15px; cursor: pointer; }

        /* 子页面 */
        .sub-page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 300; display: none; flex-direction: column; transform: translateX(100%); transition: transform 0.3s ease; }
        .sub-page.active { display: flex; transform: translateX(0); }
        .sub-header { padding: 55px 20px 15px; display: flex; align-items: center; border-bottom: 1px solid #222; }
        .sub-title { font-size: 18px; font-weight: 600; }
        .sub-content { flex: 1; overflow-y: auto; padding: 20px; }

        /* 聊天室 */
        .chat-messages { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; background: var(--chat-bg, #b2c7d9); }
        .msg-row { display: flex; gap: 8px; align-items: flex-start; }
        .msg-row.user { flex-direction: row-reverse; }
        .msg-bubble { max-width: 70%; padding: 10px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4; color: #333; word-break: break-all;}
        .msg-row.ai .msg-bubble { background: #fff; border-top-left-radius: 4px; }
        .msg-row.user .msg-bubble { background: var(--bubble-color, #FEE500); border-top-right-radius: 4px; }
        
        .chat-input-area { padding: 10px 15px 25px; background: #fff; display: flex; gap: 10px; align-items: center;}
        .chat-input-area input { flex: 1; padding: 10px; border-radius: 20px; border: none; background: #f0f0f0; outline: none; font-size: 14px;}
        .chat-input-area button { background: var(--bubble-color, #FEE500); border: none; padding: 10px 15px; border-radius: 20px; font-weight: bold; cursor: pointer;}

        /* ================= 设置 ================= */
        #app-settings { background: #f2f2f7; color: #000; overflow-y: auto; }
        .settings-header { display: flex; align-items: center; padding: 55px 15px 10px; border-bottom: 1px solid #ccc;}
        .settings-header .thin-back { color: #007aff; font-weight: 400;}
        .settings-content { display: flex; flex-direction: column; gap: 20px; padding: 20px;}
        .settings-group { background: #fff; border-radius: 10px; padding: 0 15px; }
        .settings-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #e5e5ea; font-size: 16px; cursor: pointer;}
        .settings-item:last-child { border-bottom: none; }
        .settings-item .arrow { color: #bbb; font-size: 20px; font-weight: 300;}
        
        .switch { width: 50px; height: 30px; background: #e5e5ea; border-radius: 15px; position: relative; cursor: pointer; transition: background 0.3s; }
        .switch.on { background: #34c759; }
        .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 26px; height: 26px; background: #fff; border-radius: 50%; transition: transform 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.2);}
        .switch.on::after { transform: translateX(20px); }

        /* 设置子页面 */
        .set-page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #f2f2f7; z-index: 400; display: none; flex-direction: column; transform: translateX(100%); transition: transform 0.3s; color: #000; }
        .set-page.active { display: flex; transform: translateX(0); }
        .set-page-header { padding: 55px 15px 10px; display: flex; align-items: center; border-bottom: 1px solid #ccc; }
        .set-page-content { padding: 20px; }
        .set-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; outline: none; font-size: 15px; background: #fff; margin-bottom: 15px;}
        .set-btn { background: #007aff; color: #fff; padding: 12px; border-radius: 8px; border: none; font-size: 16px; cursor: pointer; width: 100%;}

        /* 颜色块选择器 (Kakao设置) */
        .color-picker { display: flex; gap: 15px; margin: 15px 0; }
        .color-option { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-option.active { border-color: #007aff; }
    </style>
</head>
<body>

    <div id="phone">
        <div id="brightness-overlay"></div>
        
        <!-- 状态栏 (全局) -->
        <div class="status-bar" id="main-status-bar">
            <span id="time">09:13</span>
            <div class="status-right"><span>📶</span><div class="battery-icon"><div class="battery-level"></div></div></div>
        </div>

        <!-- 桌面 -->
        <div id="home-screen">
            <div class="app-grid">
                <div class="app-icon" onclick="openApp('kakao', this)">
                    <div class="icon-kakao"><div class="kakao-bubble">TALK</div></div>
                    <div class="app-name">KakaoTalk</div>
                </div>
            </div>
            <div class="dock">
                <div class="app-icon" onclick="openApp('settings', this)">
                    <div class="icon-settings">
                        <svg class="settings-gear" viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
                    </div>
                    <div class="app-name">设置</div>
                </div>
            </div>
        </div>

        <!-- ================= KakaoTalk ================= -->
        <div id="app-kakao" class="app-screen">
            <!-- 主界面 -->
            <div id="kakao-main">
                <div class="kakao-header">
                    <h1>聊天</h1>
                    <div class="header-icons">
                        <span onclick="alert('搜索功能暂未开放')">🔍</span>
                        <span onclick="openSub('add-friend-page')">👤+</span>
                        <span onclick="alert('新建聊天')">💬+</span>
                        <span onclick="openSub('kakao-settings-page')">⚙️</span>
                    </div>
                </div>
                <div class="pill-container">
                    <div class="pill active" id="tab-all" onclick="switchTab('all')">全部</div>
                    <div class="pill" id="tab-unread" onclick="switchTab('unread')">未读</div>
                </div>
                <div class="kakao-list" id="kakao-list">
                    <!-- 动态渲染 -->
                </div>
                <div class="kakao-bottom-nav">
                    <div class="nav-item" onclick="alert('好友列表')">👤</div>
                    <div class="nav-item active">💬</div>
                    <div class="nav-item" onclick="alert('通话')">📞</div>
                    <div class="nav-item" onclick="alert('更多')">⋯</div>
                </div>
            </div>

            <!-- 添加好友页面 -->
            <div id="add-friend-page" class="sub-page">
                <div class="sub-header">
                    <span class="thin-back" onclick="closeSub('add-friend-page')">‹</span>
                    <div class="sub-title">添加人物</div>
                </div>
                <div class="sub-content">
                    <input type="text" id="new-friend-name" class="set-input" placeholder="输入名字 (如: 阿月)">
                    <input type="text" id="new-friend-avatar" class="set-input" placeholder="输入一个Emoji作为头像 (如: 🌙)">
                    <button class="set-btn" onclick="saveNewFriend()">保存并添加</button>
                </div>
            </div>

            <!-- 聊天室页面 -->
            <div id="kakao-chat-page" class="sub-page">
                <div class="sub-header" style="background:#b2c7d9; border:none;">
                    <span class="thin-back" onclick="closeSub('kakao-chat-page')" style="color:#333;">‹</span>
                    <div class="sub-title" id="chat-target-name" style="color:#333;">名字</div>
                </div>
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="发送消息..." onkeypress="handleChatKey(event)">
                    <button onclick="sendKakaoMsg()">发送</button>
                </div>
            </div>

            <!-- Kakao 设置页面 -->
            <div id="kakao-settings-page" class="sub-page">
                <div class="sub-header">
                    <span class="thin-back" onclick="closeSub('kakao-settings-page')">‹</span>
                    <div class="sub-title">KakaoTalk 设置</div>
                </div>
                <div class="sub-content">
                    <div style="font-size:15px; margin-bottom:10px;">我的气泡颜色</div>
                    <div class="color-picker">
                        <div class="color-option active" style="background:#FEE500;" onclick="setBubbleColor('#FEE500', this)"></div>
                        <div class="color-option" style="background:#ff8c69;" onclick="setBubbleColor('#ff8c69', this)"></div>
                        <div class="color-option" style="background:#0B84FF;" onclick="setBubbleColor('#0B84FF', this)"></div>
                        <div class="color-option" style="background:#34c759;" onclick="setBubbleColor('#34c759', this)"></div>
                    </div>

                    <div style="font-size:15px; margin-top:30px; margin-bottom:10px;">聊天背景颜色</div>
                    <div class="color-picker">
                        <div class="color-option active" style="background:#b2c7d9;" onclick="setChatBg('#b2c7d9', this)"></div>
                        <div class="color-option" style="background:#f2f2f7;" onclick="setChatBg('#f2f2f7', this)"></div>
                        <div class="color-option" style="background:#1c1c1e;" onclick="setChatBg('#1c1c1e', this)"></div>
                        <div class="color-option" style="background:#fff;" onclick="setChatBg('#fff', this)"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= 设置 App ================= -->
        <div id="app-settings" class="app-screen">
            <!-- 主目录 -->
            <div id="settings-main">
                <div class="settings-header">
                    <span class="thin-back" onclick="goHome()">‹</span>
                    <div style="font-weight:600; font-size:18px; margin-left:10px;">设置</div>
                </div>
                <div class="settings-content">
                    <div class="settings-group">
                        <div class="settings-item" onclick="openSetPage('set-wallpaper')"><span>🖼️ 壁纸</span><span class="arrow">›</span></div>
                        <div class="settings-item" onclick="openSetPage('set-brightness')"><span>🔆 亮度</span><span class="arrow">›</span></div>
                        <div class="settings-item" onclick="openSetPage('set-mode')"><span>🌙 模式</span><span class="arrow">›</span></div>
                        <div class="settings-item" onclick="openSetPage('set-api')"><span>🔌 API</span><span class="arrow">›</span></div>
                        <div class="settings-item">
                            <span>🌜 勿扰模式</span>
                            <div class="switch" id="dnd-switch" onclick="toggleSwitch(this)"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 壁纸子页 -->
            <div id="set-wallpaper" class="set-page">
                <div class="set-page-header">
                    <span class="thin-back" onclick="closeSetPage('set-wallpaper')" style="color:#007aff;">‹</span>
                    <div style="font-size:17px;">壁纸</div>
                </div>
                <div class="set-page-content">
                    <div style="width:100%; height:200px; background:url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop') center/cover; border-radius:12px; margin-bottom:20px;" id="wp-preview"></div>
                    <input type="file" id="wp-upload" accept="image/*" onchange="changeWallpaper(event)" style="display:none;">
                    <button class="set-btn" onclick="document.getElementById('wp-upload').click()">上传本地图片</button>
                </div>
            </div>

            <!-- 亮度子页 -->
            <div id="set-brightness" class="set-page">
                <div class="set-page-header">
                    <span class="thin-back" onclick="closeSetPage('set-brightness')" style="color:#007aff;">‹</span>
                    <div style="font-size:17px;">亮度</div>
                </div>
                <div class="set-page-content">
                    <div style="background:#fff; padding:20px; border-radius:12px;">
                        <input type="range" min="10" max="100" value="100" style="width:100%; accent-color:#007aff;" oninput="changeBrightness(this.value)">
                        <div style="text-align:center; font-size:12px; color:#888; margin-top:10px;">向左滑动调暗</div>
                    </div>
                </div>
            </div>

            <!-- 模式子页 -->
            <div id="set-mode" class="set-page">
                <div class="set-page-header">
                    <span class="thin-back" onclick="closeSetPage('set-mode')" style="color:#007aff;">‹</span>
                    <div style="font-size:17px;">模式</div>
                </div>
                <div class="set-page-content">
                    <div style="background:#fff; border-radius:12px; padding:0 15px;">
                        <div class="settings-item">
                            <span>深色模式</span>
                            <div class="switch" id="dark-mode-switch" onclick="toggleDarkMode(this)"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- API 子页 -->
            <div id="set-api" class="set-page">
                <div class="set-page-header">
                    <span class="thin-back" onclick="closeSetPage('set-api')" style="color:#007aff;">‹</span>
                    <div style="font-size:17px;">API 设置</div>
                </div>
                <div class="set-page-content">
                    <input type="password" id="api-key" class="set-input" placeholder="填入 API Key">
                    <input type="text" id="api-url" class="set-input" value="https://api.deepseek.com/chat/completions">
                    <input type="text" id="api-model" class="set-input" value="deepseek-chat" placeholder="模型名称">
                    <button class="set-btn" onclick="saveApi()">保存配置</button>
                    <div style="font-size:12px; color:#888; margin-top:15px; text-align:center;">提示：如果想发照片让AI识别，请把模型换成支持 Vision 的模型（如 gpt-4o 或 qwen-vl）。</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================= 基础逻辑 =================
        function updateClock() {
            const now = new Date();
            document.getElementById('time').innerText = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        }
        setInterval(updateClock, 1000); updateClock();

        function openApp(appName, iconElement) {
            const rect = iconElement.getBoundingClientRect();
            const phoneRect = document.getElementById('phone').getBoundingClientRect();
            const originX = rect.left - phoneRect.left + rect.width / 2;
            const originY = rect.top - phoneRect.top + rect.height / 2;

            const appScreen = document.getElementById('app-' + appName);
            appScreen.style.transformOrigin = `${originX}px ${originY}px`;
            appScreen.style.display = 'flex';
            void appScreen.offsetWidth; 
            appScreen.classList.add('active');
            
            if(appName === 'kakao') renderKakaoList();
        }

        function goHome() {
            document.querySelectorAll('.app-screen').forEach(el => el.classList.remove('active'));
            closeSub('kakao-chat-page');
            closeSub('add-friend-page');
            closeSetPage('set-api');
        }

        // ================= 设置 App 逻辑 =================
        function openSetPage(id) { document.getElementById(id).classList.add('active'); }
        function closeSetPage(id) { document.getElementById(id).classList.remove('active'); }
        function toggleSwitch(el) { el.classList.toggle('on'); }
        
        function changeBrightness(val) {
            // 10-100 映射到 0.8-0
            let opacity = (100 - val) / 100 * 0.8;
            document.getElementById('brightness-overlay').style.opacity = opacity;
        }

        function changeWallpaper(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('phone').style.background = `url('${e.target.result}') center/cover`;
                document.getElementById('wp-preview').style.background = `url('${e.target.result}') center/cover`;
            };
            reader.readAsDataURL(file);
        }

        function toggleDarkMode(el) {
            el.classList.toggle('on');
            document.body.classList.toggle('dark-mode');
        }

        function saveApi() {
            localStorage.setItem('api_key', document.getElementById('api-key').value.trim());
            localStorage.setItem('api_url', document.getElementById('api-url').value.trim());
            localStorage.setItem('api_model', document.getElementById('api-model').value.trim());
            alert("API 保存成功！");
        }

        // 初始化加载设置
        document.getElementById('api-key').value = localStorage.getItem('api_key') || '';
        document.getElementById('api-url').value = localStorage.getItem('api_url') || 'https://api.deepseek.com/chat/completions';
        document.getElementById('api-model').value = localStorage.getItem('api_model') || 'deepseek-chat';


        // ================= KakaoTalk 逻辑 =================
        let friends = JSON.parse(localStorage.getItem('kakao_friends')) || [];
        let chats = JSON.parse(localStorage.getItem('kakao_chats')) || {}; // 以好友名字为 key
        let currentTab = 'all';
        let activeFriendName = '';

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-all').classList.remove('active');
            document.getElementById('tab-unread').classList.remove('active');
            if(tab === 'all') document.getElementById('tab-all').classList.add('active');
            if(tab === 'unread') document.getElementById('tab-unread').classList.add('active');
            renderKakaoList();
        }

        function openSub(id) { document.getElementById(id).classList.add('active'); }
        function closeSub(id) { document.getElementById(id).classList.remove('active'); }

        function saveNewFriend() {
            const name = document.getElementById('new-friend-name').value.trim();
            const avatar = document.getElementById('new-friend-avatar').value.trim() || '👤';
            if (!name) return alert("请输入名字");
            
            if (!friends.includes(name)) {
                friends.push(name);
                chats[name] = []; // 初始化聊天记录
                localStorage.setItem('kakao_friends', JSON.stringify(friends));
                localStorage.setItem('kakao_chats', JSON.stringify(chats));
            }
            document.getElementById('new-friend-name').value = '';
            document.getElementById('new-friend-avatar').value = '';
            closeSub('add-friend-page');
            renderKakaoList();
        }

        function renderKakaoList() {
            const list = document.getElementById('kakao-list');
            list.innerHTML = '';

            let displayFriends = friends;
            if (currentTab === 'unread') {
                // 简单实现：如果有聊天记录且最后一条不是用户发的，算未读
                displayFriends = friends.filter(name => {
                    const history = chats[name] || [];
                    return history.length > 0 && history[history.length - 1].role === 'assistant';
                });
            }

            if (displayFriends.length === 0) {
                list.innerHTML = `<div style="text-align:center; color:#666; margin-top:50px;">${currentTab === 'unread' ? '没有未读消息' : '暂无好友，点击右上角👤+添加'}</div>`;
                return;
            }

            displayFriends.forEach(name => {
                const history = chats[name] || [];
                const lastMsg = history.length > 0 ? history[history.length - 1].content : '开始聊天吧';
                const unreadBadge = (history.length > 0 && history[history.length-1].role === 'assistant') ? `<div style="background:#FEE500; color:#333; border-radius:10px; padding:2px 6px; margin-top:5px; font-weight:bold; display:inline-block;">1</div>` : '';

                const div = document.createElement('div');
                div.className = 'kakao-item';
                div.onclick = () => enterChat(name);
                div.innerHTML = `
                    <div class="kakao-avatar" style="background:#ddd;">👤</div>
                    <div class="kakao-info">
                        <div class="kakao-name">${name}</div>
                        <div class="kakao-preview">${lastMsg}</div>
                    </div>
                    <div class="kakao-meta">
                        <div>刚刚</div>
                        ${unreadBadge}
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function enterChat(name) {
            activeFriendName = name;
            document.getElementById('chat-target-name').innerText = name;
            openSub('kakao-chat-page');
            renderChatMessages();
        }

        function renderChatMessages() {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';
            const history = chats[activeFriendName] || [];
            
            history.forEach(msg => {
                const row = document.createElement('div');
                row.className = `msg-row ${msg.role === 'user' ? 'user' : 'ai'}`;
                row.innerHTML = `<div class="msg-bubble">${msg.content}</div>`;
                container.appendChild(row);
            });
            container.scrollTop = container.scrollHeight;
        }

        function handleChatKey(e) { if(e.key === 'Enter') sendKakaoMsg(); }

        async function sendKakaoMsg() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            // 写入用户消息
            if(!chats[activeFriendName]) chats[activeFriendName] = [];
            chats[activeFriendName].push({ role: 'user', content: text });
            localStorage.setItem('kakao_chats', JSON.stringify(chats));
            input.value = '';
            renderChatMessages();

            // 请求 API
            const apiKey = localStorage.getItem('api_key');
            const apiUrl = localStorage.getItem('api_url');
            const model = localStorage.getItem('api_model');

            if (!apiKey) {
                setTimeout(() => {
                    chats[activeFriendName].push({ role: 'assistant', content: '(请先去设置里配置 API)' });
                    localStorage.setItem('kakao_chats', JSON.stringify(chats));
                    renderChatMessages();
                }, 500);
                return;
            }

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ 
                        model: model, 
                        messages: [
                            { role: "system", content: `你现在的名字叫${activeFriendName}。你是一个真实的聊天对象。请简短自然地回复。` },
                            ...chats[activeFriendName].map(m => ({role: m.role, content: m.content}))
                        ]
                    })
                });
                const data = await response.json();
                if (data.choices && data.choices.length > 0) {
                    chats[activeFriendName].push({ role: 'assistant', content: data.choices[0].message.content });
                    localStorage.setItem('kakao_chats', JSON.stringify(chats));
                    renderChatMessages();
                }
            } catch (e) {
                chats[activeFriendName].push({ role: 'assistant', content: '(网络出错)' });
                renderChatMessages();
            }
        }

        // Kakao 外观设置
        function setBubbleColor(color, el) {
            document.documentElement.style.setProperty('--bubble-color', color);
            document.querySelectorAll('.color-option').forEach(e => {
                if(e.parentElement.previousElementSibling.innerText.includes("气泡")) e.classList.remove('active');
            });
            el.classList.add('active');
        }

        function setChatBg(color, el) {
            document.documentElement.style.setProperty('--chat-bg', color);
            document.querySelectorAll('.color-option').forEach(e => {
                if(e.parentElement.previousElementSibling.innerText.includes("背景")) e.classList.remove('active');
            });
            el.classList.add('active');
        }

    </script>
</body>
</html>
