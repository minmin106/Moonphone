<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Liquid Glass Desktop</title>
 <style>
        /* ==========================================================================
   CSS VARIABLES & DESIGN SYSTEM (LIQUID GLASS AESTHETIC)
   ========================================================================== */
:root {
  /* Dynamic Liquid Glass Materials */
  --glass-bg-base: rgba(255, 255, 255, 0.12);
  --glass-bg-hover: rgba(255, 255, 255, 0.22);
  --glass-bg-active: rgba(255, 255, 255, 0.3);
  --glass-dock-bg: rgba(255, 255, 255, 0.18);
  --glass-modal-bg: rgba(245, 247, 250, 0.42);

  /* Borders & Specular Highlights */
  --glass-border: rgba(255, 255, 255, 0.35);
  --glass-border-subtle: rgba(255, 255, 255, 0.18);
  --glass-specular: rgba(255, 255, 255, 0.7);
  --glass-inner-shadow: inset 0 1.5px 1.5px rgba(255, 255, 255, 0.6),
                        inset 0 -1px 2px rgba(0, 0, 0, 0.05);

  /* Shadows */
  --shadow-dock: 0 16px 40px -8px rgba(0, 0, 0, 0.12),
                 0 2px 6px rgba(0, 0, 0, 0.04);
  --shadow-tile: 0 8px 24px -4px rgba(0, 0, 0, 0.08),
                 0 2px 6px -1px rgba(0, 0, 0, 0.04);
  --shadow-modal: 0 30px 60px -12px rgba(0, 0, 0, 0.25),
                  0 0 1px 1px rgba(255, 255, 255, 0.4);

  /* Blur Engine */
  --blur-app: blur(28px) saturate(190%);
  --blur-dock: blur(34px) saturate(210%);
  --blur-modal: blur(44px) saturate(200%);

  /* Typography Colors */
  --text-primary: rgba(20, 24, 33, 0.88);
  --text-secondary: rgba(20, 24, 33, 0.58);
  --text-accent: #0071e3;

  /* Dimensions & Spacing */
  --icon-size: clamp(56px, 7.5vw, 68px);
  --icon-radius: clamp(15px, 2vw, 19px);
  --dock-radius: clamp(24px, 3.5vw, 36px);
  --dock-padding: clamp(10px, 1.6vw, 16px);
  --grid-gap: clamp(20px, 3.2vw, 36px);

  /* Transitions */
  --ease-liquid: cubic-bezier(0.16, 1, 0.3, 1);
  --transition-fast: 0.22s var(--ease-liquid);
  --transition-smooth: 0.4s var(--ease-liquid);
}

/* Base Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
               "Helvetica Neue", Helvetica, Arial, sans-serif;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  background-color: #e4e7eb;
  color: var(--text-primary);
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
}

/* ==========================================================================
   AMBIENT BACKGROUND (Subtle Ethereal Halo)
   ========================================================================== */
.ambient-background {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  background: linear-gradient(135deg, #e7edf5 0%, #d8e2ec 40%, #dee7ec 100%);
}

.glow-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.65;
  will-change: transform;
}

.orb-1 {
  width: 480px;
  height: 480px;
  background: radial-gradient(circle, rgba(162, 194, 230, 0.75) 0%, rgba(180, 215, 245, 0) 70%);
  top: -100px;
  right: -50px;
  animation: floatOrb 18s ease-in-out infinite alternate;
}

.orb-2 {
  width: 520px;
  height: 520px;
  background: radial-gradient(circle, rgba(240, 208, 222, 0.65) 0%, rgba(240, 210, 225, 0) 70%);
  bottom: 0px;
  left: -120px;
  animation: floatOrb 22s ease-in-out infinite alternate-reverse;
}

.orb-3 {
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(200, 228, 225, 0.55) 0%, rgba(200, 228, 225, 0) 70%);
  top: 35%;
  left: 30%;
  animation: floatOrb 15s ease-in-out infinite alternate;
}

@keyframes floatOrb {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(25px, -30px) scale(1.06); }
  100% { transform: translate(-20px, 20px) scale(0.96); }
}

/* ==========================================================================
   DESKTOP VIEWPORT LAYOUT
   ========================================================================== */
.desktop-viewport {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: env(safe-area-inset-top, 12px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 8px) env(safe-area-inset-left, 16px);
  max-width: 1300px;
  margin: 0 auto;
}

/* ==========================================================================
   TOP STATUS BAR
   ========================================================================== */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 44px;
  padding: 0 18px;
  color: var(--text-primary);
  font-weight: 500;
  font-size: 0.95rem;
  letter-spacing: -0.01em;
}

.status-left {
  display: flex;
  align-items: center;
}

.status-time {
  font-weight: 600;
  letter-spacing: 0.02em;
}

.status-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.status-icon {
  width: 16px;
  height: 12px;
  color: var(--text-primary);
}

.battery-wrapper {
  display: flex;
  align-items: center;
  gap: 1.5px;
}

.battery-body {
  width: 22px;
  height: 11.5px;
  border: 1.5px solid currentColor;
  border-radius: 3.5px;
  padding: 1.5px;
  display: flex;
  align-items: center;
}

.battery-level {
  width: 75%;
  height: 100%;
  background: currentColor;
  border-radius: 1.5px;
}

.battery-cap {
  width: 1.5px;
  height: 4.5px;
  background: currentColor;
  border-radius: 0 1px 1px 0;
}

/* ==========================================================================
   APP GRID
   ========================================================================== */
.app-grid-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px 0;
  overflow-y: auto;
  scrollbar-width: none;
}
.app-grid-container::-webkit-scrollbar {
  display: none;
}

.app-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--grid-gap);
  padding: 16px;
  max-width: 480px;
  width: 100%;
  margin: auto;
}

@media (min-width: 768px) {
  .app-grid {
    grid-template-columns: repeat(6, 1fr);
    max-width: 780px;
  }
}

@media (min-width: 1024px) {
  .app-grid {
    grid-template-columns: repeat(6, 1fr);
    max-width: 860px;
  }
}

/* Icon Elements & Liquid Glass Surface */
.app-item {
  background: none;
  border: none;
  outline: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  transition: transform var(--transition-fast);
}

.app-item:active {
  transform: scale(0.92);
}

.icon-tile {
  width: var(--icon-size);
  height: var(--icon-size);
  border-radius: var(--icon-radius);
  background: var(--glass-bg-base);
  backdrop-filter: var(--blur-app);
  -webkit-backdrop-filter: var(--blur-app);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-tile), var(--glass-inner-shadow);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-primary);
  position: relative;
  overflow: hidden;
  transition: background var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
}

.icon-tile::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 48%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0) 100%);
  border-radius: var(--icon-radius) var(--icon-radius) 0 0;
  pointer-events: none;
}

.app-item:hover .icon-tile {
  background: var(--glass-bg-hover);
  border-color: rgba(255, 255, 255, 0.5);
  box-shadow: 0 12px 28px -4px rgba(0, 0, 0, 0.12), var(--glass-inner-shadow);
}

.icon-tile.special-glow {
  background: rgba(0, 113, 227, 0.15);
  border-color: rgba(0, 113, 227, 0.35);
  color: var(--text-accent);
}

.app-svg {
  width: 52%;
  height: 52%;
  position: relative;
  z-index: 1;
}

.app-label {
  font-size: 0.74rem;
  font-weight: 500;
  color: var(--text-primary);
  letter-spacing: -0.01em;
  text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
  white-space: nowrap;
  pointer-events: none;
}

/* ==========================================================================
   BOTTOM DOCK
   ========================================================================== */
.dock-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding-bottom: 6px;
}

.dock-glass {
  background: var(--glass-dock-bg);
  backdrop-filter: var(--blur-dock);
  -webkit-backdrop-filter: var(--blur-dock);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-dock), var(--glass-inner-shadow);
  border-radius: var(--dock-radius);
  padding: var(--dock-padding);
  display: flex;
  align-items: center;
  gap: clamp(12px, 2.2vw, 24px);
  position: relative;
  overflow: hidden;
}

.dock-glass::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 50%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.42) 0%, rgba(255, 255, 255, 0) 100%);
  border-radius: var(--dock-radius) var(--dock-radius) 0 0;
  pointer-events: none;
}

.dock-item {
  background: none;
  border: none;
  outline: none;
  cursor: pointer;
  transition: transform var(--transition-fast);
}

.dock-item:active {
  transform: scale(0.9);
}

.dock-item .icon-tile {
  box-shadow: 0 6px 16px -2px rgba(0, 0, 0, 0.08), var(--glass-inner-shadow);
}

.home-indicator {
  width: 135px;
  height: 4.5px;
  background: rgba(0, 0, 0, 0.22);
  border-radius: 99px;
  margin-top: 2px;
}

/* ==========================================================================
   LIQUID GLASS MODAL / POPOVER
   ========================================================================== */
.liquid-modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0, 0, 0, 0.16);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition-smooth);
}

.liquid-modal-backdrop.is-active {
  opacity: 1;
  pointer-events: auto;
}

.liquid-modal-window {
  width: 100%;
  max-width: 440px;
  background: var(--glass-modal-bg);
  backdrop-filter: var(--blur-modal);
  -webkit-backdrop-filter: var(--blur-modal);
  border: 1px solid var(--glass-border);
  border-radius: 28px;
  box-shadow: var(--shadow-modal), var(--glass-inner-shadow);
  padding: 24px;
  transform: scale(0.92) translateY(20px);
  opacity: 0;
  transition: transform var(--transition-smooth), opacity var(--transition-smooth);
  position: relative;
  overflow: hidden;
}

.liquid-modal-backdrop.is-active .liquid-modal-window {
  transform: scale(1) translateY(0);
  opacity: 1;
}

.modal-specular-edge {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 55%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0) 100%);
  pointer-events: none;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  position: relative;
  z-index: 2;
}

.modal-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 0.74rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-accent);
  background: rgba(0, 113, 227, 0.1);
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid rgba(0, 113, 227, 0.2);
}

.pulse-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-accent);
  box-shadow: 0 0 8px var(--text-accent);
  animation: pulseDot 2s infinite ease-in-out;
}

@keyframes pulseDot {
  0%, 100% { opacity: 0.4; transform: scale(0.9); }
  50% { opacity: 1; transform: scale(1.2); }
}

.modal-close-btn {
  background: rgba(0, 0, 0, 0.05);
  border: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  cursor: pointer;
  transition: background var(--transition-fast), color var(--transition-fast);
}

.modal-close-btn:hover {
  background: rgba(0, 0, 0, 0.1);
  color: var(--text-primary);
}

.modal-title {
  font-size: 1.28rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
  color: var(--text-primary);
  position: relative;
  z-index: 2;
}

.modal-description {
  font-size: 0.88rem;
  line-height: 1.45;
  color: var(--text-secondary);
  margin-bottom: 20px;
  position: relative;
  z-index: 2;
}

.liquid-input-container {
  margin-bottom: 22px;
  position: relative;
  z-index: 2;
}

.liquid-input {
  width: 100%;
  border: 1px solid var(--glass-border-subtle);
  background: rgba(255, 255, 255, 0.45);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding: 12px 14px;
  border-radius: 14px;
  font-size: 0.92rem;
  color: var(--text-primary);
  outline: none;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.03);
  transition: border-color var(--transition-fast), background var(--transition-fast);
}

.liquid-input:focus {
  border-color: rgba(0, 113, 227, 0.5);
  background: rgba(255, 255, 255, 0.65);
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  position: relative;
  z-index: 2;
}

.liquid-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 18px;
  border-radius: 12px;
  font-size: 0.88rem;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid transparent;
  outline: none;
  transition: transform var(--transition-fast), background var(--transition-fast);
}

.liquid-btn:active {
  transform: scale(0.96);
}

.btn-secondary {
  background: rgba(0, 0, 0, 0.05);
  color: var(--text-primary);
}

.btn-secondary:hover {
  background: rgba(0, 0, 0, 0.09);
}

.btn-primary {
  background: var(--text-accent);
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
}

.btn-primary:hover {
  background: #0077ed;
}
    </style>
</head>
<body>
  <!-- Ambient Dynamic Lighting Layer -->
  <div class="ambient-background">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <!-- System Shell -->
  <main class="desktop-viewport">
    
    <!-- Top Status Bar -->
    <header class="status-bar">
      <div class="status-left">
        <span class="status-time" id="status-time">09:41</span>
      </div>
      <div class="status-right">
        <!-- Cellular Signal -->
        <svg class="status-icon" viewBox="0 0 18 12" fill="none">
          <rect x="0" y="9" width="2.5" height="3" rx="0.8" fill="currentColor"/>
          <rect x="4.5" y="6" width="2.5" height="6" rx="0.8" fill="currentColor"/>
          <rect x="9" y="3" width="2.5" height="9" rx="0.8" fill="currentColor"/>
          <rect x="13.5" y="0" width="2.5" height="12" rx="0.8" fill="currentColor"/>
        </svg>

        <!-- Wi-Fi -->
        <svg class="status-icon" viewBox="0 0 16 12" fill="none">
          <path d="M8 10.5C8.5 10.5 9 10.05 9 9.5C9 8.95 8.5 8.5 8 8.5C7.5 8.5 7 8.95 7 9.5C7 10.05 7.5 10.5 8 10.5Z" fill="currentColor"/>
          <path d="M4.5 6.5C5.5 5.5 6.7 5 8 5C9.3 5 10.5 5.5 11.5 6.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M2 3.8C3.6 2.3 5.7 1.5 8 1.5C10.3 1.5 12.4 2.3 14 3.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>

        <!-- Battery -->
        <div class="battery-wrapper">
          <div class="battery-body">
            <div class="battery-level"></div>
          </div>
          <div class="battery-cap"></div>
        </div>
      </div>
    </header>

    <!-- Main Icon Grid (11 Apps) -->
    <section class="app-grid-container">
      <div class="app-grid">

        <!-- 1. Weather -->
        <button class="app-item" data-app-id="weather" data-title="Weather">
          <div class="icon-tile">
            <svg viewBox="0 0 32 32" class="app-svg">
              <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="1.8"/>
              <path d="M12 4V2M12 22V20M4 12H2M22 12H20M6.3 6.3L4.9 4.9M19.1 19.1L17.7 17.7M6.3 17.7L4.9 19.1M19.1 4.9L17.7 6.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M14 26C11.5 26 9.5 24.2 9.5 22C9.5 20.3 10.6 18.9 12.2 18.3C12.8 15.8 15 14 17.6 14C20.8 14 23.3 16.4 23.5 19.5C25 19.9 26 21.3 26 23C26 24.7 24.7 26 23 26H14Z" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="app-label">Weather</span>
        </button>

        <!-- 2. Calendar -->
        <button class="app-item" data-app-id="calendar" data-title="Calendar">
          <div class="icon-tile">
            <svg viewBox="0 0 32 32" class="app-svg">
              <rect x="4" y="6" width="24" height="22" rx="6" stroke="currentColor" stroke-width="1.8"/>
              <line x1="4" y1="13" x2="28" y2="13" stroke="currentColor" stroke-width="1.8"/>
              <line x1="9" y1="3" x2="9" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <line x1="23" y1="3" x2="23" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <circle cx="11" cy="19" r="1.5" fill="currentColor"/>
              <circle cx="16" cy="19" r="1.5" fill="currentColor"/>
              <circle cx="21" cy="19" r="1.5" fill="currentColor"/>
            </svg>
          </div>
          <span class="app-label">Calendar</span>
        </button>

        <!-- 3. Reminders -->
        <button class="app-item" data-app-id="reminders" data-title="Reminders">
          <div class="icon-tile">
            <svg viewBox="0 0 32 32" class="app-svg">
              <circle cx="7" cy="10" r="2.2" stroke="currentColor" stroke-width="1.8"/>
              <line x1="13" y1="10" x2="26" y2="10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <circle cx="7" cy="16" r="2.2" stroke="currentColor" stroke-width="1.8"/>
              <line x1="13" y1="16" x2="26" y2="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <circle cx="7" cy="22" r="2.2" stroke="currentColor" stroke-width="1.8"/>
              <line x1="13" y1="22" x2="26" y2="22" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="app-label">Reminders</span>
        </button>

        <!-- 4. Notes -->
        <button class="app-item" data-app-id="notes" data-title="Notes">
          <div class="icon-tile">
            <svg viewBox="0 0 32 32" class="app-svg">
              <rect x="5" y="4" width="22" height="24" rx="4" stroke="currentColor" stroke-width="1.8"/>
              <line x1="9" y1="10" x2="23" y2="10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <line x1="9" y1="15" x2="23" y2="15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <line x1="9" y1="20" x2="17" y2="20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="app-label">Notes</span>
        </button>

        <!-- 5. KakaoTalk -->
        <button class="app-item" data-app-id="kakaotalk" data-title="KakaoTalk">
          <div class="icon-tile">
            <svg viewBox="0 0 32 32" class="app-svg">
              <path d="M16 6C9.9 6 5 10 5 15C5 18.2 7 20.9 10.1 22.5L9 26.5L14 23.8C14.6 23.9 15.3 24 16 24C22.1 24 27 20 27 15C27 10 22.1 6 16 6Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M11 13V18M11 15.5H14M14 13V18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M18 13V18M18 15.5L21 18M18 15.5L21 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="app-label">KakaoTalk</span>
        </button>

        <!-- 6. Schedule -->
        <button class="app-item" data-app-id="schedule" data-title="Schedule">
          <div class="icon-tile">
            <svg viewBox="0 0 32 32" class="app-svg">

    <!-- Liquid Glass Modal / Popover (Simulate Active Sending / Notification) -->

        <div class="modal-specular-edge"></div>
        <div class="modal-header">
          <div class="modal-badge">
            <span class="pulse-dot"></span>
            <span>Liquid Session</span>
          </div>
          <button class="modal-close-btn" id="modal-close" aria-label="Close">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="modal-body">
          <h3 class="modal-title" id="modal-title">Quick Message Dispatch</h3>
          <p class="modal-description" id="modal-desc">
            System ready for message dispatch. State is fully synchronized with Liquid Glass environment.
          </p>
          <div class="liquid-input-container">
            <input type="text" class="liquid-input" id="message-input" placeholder="Type a message or trigger instruction..." />
          </div>
        </div>

        <div class="modal-footer">
          <button class="liquid-btn btn-secondary" id="btn-cancel">Dismiss</button>
          <button class="liquid-btn btn-primary" id="btn-send">
            <span>Send</span>
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <line x1="3" y1="8" x2="13" y2="8"></line>
              <polyline points="9 4 13 8 9 12"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </aside>

  </main>

<script>
        /**
 * iOS Liquid Glass System Desktop Front-End Controller
 * Responsibilities:
 *  1. Live status bar clock synchronization
 *  2. Application invocation & Liquid Glass modal lifecycle
 *  3. Dynamic active messaging popover demonstration
 *  4. Clean expansion structure reserved for future API/Chat services
 */

document.addEventListener("DOMContentLoaded", () => {
  // --- 1. Real-Time Status Clock ---
  const timeElement = document.getElementById("status-time");

  const updateClock = () => {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, "0");
    const minutes = String(now.getMinutes()).padStart(2, "0");
    timeElement.textContent = `${hours}:${minutes}`;
  };

  updateClock();
  setInterval(updateClock, 1000 * 30);

  // --- 2. Modal Controller & Message Popover ---
  const modalBackdrop = document.getElementById("liquid-modal");
  const modalTitle = document.getElementById("modal-title");
  const modalDesc = document.getElementById("modal-desc");
  const messageInput = document.getElementById("message-input");
  const btnClose = document.getElementById("modal-close");
  const btnCancel = document.getElementById("btn-cancel");
  const btnSend = document.getElementById("btn-send");
  const btnOpenComposer = document.getElementById("btn-open-composer");

  /**
   * Opens the Liquid Glass Modal
   * @param {string} title 
   * @param {string} description 
   * @param {string} placeholder 
   */
  const openModal = (title, description, placeholder = "") => {
    modalTitle.textContent = title;
    modalDesc.textContent = description;
    messageInput.placeholder = placeholder || "Enter command or message...";
    messageInput.value = "";
    
    modalBackdrop.classList.add("is-active");
    modalBackdrop.setAttribute("aria-hidden", "false");

    // Smooth focus after animation starts
    setTimeout(() => {
      messageInput.focus();
    }, 150);
  };

  /**
   * Closes the Liquid Glass Modal
   */
  const closeModal = () => {
    modalBackdrop.classList.remove("is-active");
    modalBackdrop.setAttribute("aria-hidden", "true");
    messageInput.blur();
  };

  // Close triggers
  btnClose.addEventListener("click", closeModal);
  btnCancel.addEventListener("click", closeModal);
  
  // Close on backdrop tap
  modalBackdrop.addEventListener("click", (e) => {
    if (e.target === modalBackdrop) {
      closeModal();
    }
  });

  // ESC key dismiss
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modalBackdrop.classList.contains("is-active")) {
      closeModal();
    }
  });

  // --- 3. Active Sending Simulation ---
  btnOpenComposer.addEventListener("click", () => {
    openModal(
      "Direct Liquid Dispatch",
      "Trigger an active sending event directly to connected pipeline.",
      "Type message to broadcast..."
    );
  });

  btnSend.addEventListener("click", () => {
    const payload = messageInput.value.trim();
    if (!payload) {
      messageInput.focus();
      return;
    }

    // Future hook: connect to external AI/WebSocket API here
    console.log(`[Liquid System] Sent payload:`, payload);

    // Provide subtle UI completion feedback
    btnSend.textContent = "Dispatched!";
    setTimeout(() => {
      btnSend.innerHTML = `
        <span>Send</span>
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <line x1="3" y1="8" x2="13" y2="8"></line>
          <polyline points="9 4 13 8 9 12"></polyline>
        </svg>
      `;
      closeModal();
    }, 450);
  });

  // --- 4. Application Grid & Dock Interaction ---
  const allAppButtons = document.querySelectorAll(".app-item:not(.action-sender), .dock-item");

  allAppButtons.forEach((app) => {
    app.addEventListener("click", () => {
      const appId = app.getAttribute("data-app-id");
      const appTitle = app.getAttribute("data-title") || appId;

      // Clean transition into app modal/session view
      openModal(
        appTitle,
        `Active window for ${appTitle}. Liquid session is initiated and ready for future modular extension.`,
        `Type query or action for ${appTitle}...`
      );
    });
  });
});
    </script>
