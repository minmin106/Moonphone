<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Liquid Glass Desktop</title>
  <style>
        /* ==========================================================================
   CSS VARIABLES & LIQUID GLASS SPECIFICATIONS
   ========================================================================== */
:root {
  /* Translucent Liquid Glass Layers */
  --glass-bg-base: rgba(255, 255, 255, 0.16);
  --glass-bg-hover: rgba(255, 255, 255, 0.28);
  --glass-bg-active: rgba(255, 255, 255, 0.38);
  --glass-dock-bg: rgba(255, 255, 255, 0.2);
  --glass-modal-bg: rgba(248, 250, 252, 0.45);

  /* Delicate Specular Edges & Borders */
  --glass-border: rgba(255, 255, 255, 0.42);
  --glass-border-subtle: rgba(255, 255, 255, 0.2);
  --glass-inner-highlight: inset 0 1px 1px rgba(255, 255, 255, 0.7),
                           inset 0 -1px 1px rgba(255, 255, 255, 0.15);

  /* Optical Blur */
  --blur-surface: blur(30px) saturate(180%);
  --blur-dock: blur(36px) saturate(200%);
  --blur-modal: blur(48px) saturate(210%);

  /* Soft Ambient Shadows */
  --shadow-tile: 0 8px 24px -4px rgba(20, 24, 38, 0.06),
                 0 2px 6px -1px rgba(20, 24, 38, 0.03);
  --shadow-dock: 0 18px 42px -6px rgba(20, 24, 38, 0.1),
                 0 2px 6px rgba(0, 0, 0, 0.03);
  --shadow-modal: 0 32px 64px -12px rgba(10, 15, 30, 0.22);

  /* Color Palette */
  --text-primary: rgba(18, 22, 30, 0.86);
  --text-secondary: rgba(18, 22, 30, 0.52);
  --accent-color: #0071e3;
  --icon-stroke-color: rgba(22, 26, 35, 0.82);

  /* Geometry & Scaling */
  --icon-size: clamp(56px, 7vw, 66px);
  --icon-radius: clamp(16px, 2vw, 19px);
  --dock-radius: clamp(26px, 3.5vw, 36px);
  --grid-gap: clamp(18px, 3vw, 36px);

  /* Easing curves */
  --ease-liquid: cubic-bezier(0.16, 1, 0.3, 1);
  --transition-fast: 0.22s var(--ease-liquid);
  --transition-smooth: 0.4s var(--ease-liquid);
}

/* Base Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
               "Helvetica Neue", Helvetica, Arial, sans-serif;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  background-color: #e2e6eb;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ==========================================================================
   AMBIENT ATMOSPHERIC BACKGROUND
   ========================================================================== */
.ambient-background {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: linear-gradient(135deg, #e4ebf3 0%, #d5e0ec 50%, #dce5ec 100%);
}

.glow-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(85px);
  opacity: 0.58;
}

.orb-1 {
  width: 480px;
  height: 480px;
  background: radial-gradient(circle, rgba(168, 198, 232, 0.7) 0%, rgba(180, 215, 245, 0) 70%);
  top: -80px;
  right: -60px;
}

.orb-2 {
  width: 520px;
  height: 520px;
  background: radial-gradient(circle, rgba(235, 208, 222, 0.6) 0%, rgba(235, 210, 225, 0) 70%);
  bottom: -40px;
  left: -80px;
}

.orb-3 {
  width: 420px;
  height: 420px;
  background: radial-gradient(circle, rgba(198, 228, 222, 0.5) 0%, rgba(198, 228, 222, 0) 70%);
  top: 35%;
  left: 28%;
}

/* ==========================================================================
   VIEWPORT & STATUS BAR
   ========================================================================== */
.desktop-viewport {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: env(safe-area-inset-top, 10px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 8px) env(safe-area-inset-left, 16px);
  max-width: 1280px;
  margin: 0 auto;
}

.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 44px;
  padding: 0 20px;
  font-size: 0.94rem;
  letter-spacing: -0.01em;
}

.status-time {
  font-weight: 600;
  letter-spacing: 0.01em;
}

.status-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Minimalist Linear System SVGs */
.sys-icon {
  width: 17px;
  height: 17px;
  stroke: currentColor;
  stroke-width: 1.35;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}

.battery-wrapper {
  display: flex;
  align-items: center;
}

.battery-svg {
  width: 24px;
  height: 12px;
  stroke: currentColor;
  stroke-width: 1.35;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}

/* ==========================================================================
   APP GRID & ICON SPECIFICATIONS
   ========================================================================== */
.app-grid-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px 0;
  overflow-y: auto;
  scrollbar-width: none;
}
.app-grid-container::-webkit-scrollbar {
  display: none;
}

.app-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--grid-gap);
  padding: 16px;
  max-width: 480px;
  width: 100%;
  margin: auto;
}

@media (min-width: 768px) {
  .app-grid {
    grid-template-columns: repeat(6, 1fr);
    max-width: 760px;
  }
}

@media (min-width: 1024px) {
  .app-grid {
    grid-template-columns: repeat(6, 1fr);
    max-width: 840px;
  }
}

.app-item {
  background: none;
  border: none;
  outline: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: transform var(--transition-fast);
}

.app-item:active {
  transform: scale(0.92);
}

/* Pure Liquid Glass Material */
.icon-tile {
  width: var(--icon-size);
  height: var(--icon-size);
  border-radius: var(--icon-radius);
  background: var(--glass-bg-base);
  backdrop-filter: var(--blur-surface);
  -webkit-backdrop-filter: var(--blur-surface);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-tile), var(--glass-inner-highlight);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--icon-stroke-color);
  position: relative;
  overflow: hidden;
  transition: background var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
}

/* Top Subtle Specular Light Film */
.icon-tile::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 44%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.42) 0%, rgba(255, 255, 255, 0) 100%);
  border-radius: var(--icon-radius) var(--icon-radius) 0 0;
  pointer-events: none;
}

.app-item:hover .icon-tile {
  background: var(--glass-bg-hover);
  border-color: rgba(255, 255, 255, 0.6);
  box-shadow: 0 10px 26px -3px rgba(20, 24, 38, 0.09), var(--glass-inner-highlight);
}

.icon-tile.active-trigger {
  color: var(--accent-color);
  border-color: rgba(0, 113, 227, 0.35);
  background: rgba(0, 113, 227, 0.08);
}

/* Strict Minimalist Linear App SVG Rules */
.app-svg {
  width: 50%;
  height: 50%;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.35;
  stroke-linecap: round;
  stroke-linejoin: round;
  position: relative;
  z-index: 1;
}

.app-label {
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--text-primary);
  letter-spacing: -0.01em;
  text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
  white-space: nowrap;
  pointer-events: none;
}

/* ==========================================================================
   BOTTOM DOCK
   ========================================================================== */
.dock-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding-bottom: 6px;
}

.dock-glass {
  background: var(--glass-dock-bg);
  backdrop-filter: var(--blur-dock);
  -webkit-backdrop-filter: var(--blur-dock);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow-dock), var(--glass-inner-highlight);
  border-radius: var(--dock-radius);
  padding: clamp(10px, 1.6vw, 15px);
  display: flex;
  align-items: center;
  gap: clamp(12px, 2.2vw, 24px);
  position: relative;
  overflow: hidden;
}

.dock-glass::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 48%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.38) 0%, rgba(255, 255, 255, 0) 100%);
  border-radius: var(--dock-radius) var(--dock-radius) 0 0;
  pointer-events: none;
}

.dock-item {
  background: none;
  border: none;
  outline: none;
  cursor: pointer;
  transition: transform var(--transition-fast);
}

.dock-item:active {
  transform: scale(0.9);
}

.home-indicator {
  width: 132px;
  height: 4px;
  background: rgba(0, 0, 0, 0.2);
  border-radius: 99px;
  margin-top: 2px;
}

/* ==========================================================================
   LIQUID GLASS MODAL / POPOVER
   ========================================================================== */
.liquid-modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(15, 20, 30, 0.14);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition-smooth);
}

.liquid-modal-backdrop.is-active {
  opacity: 1;
  pointer-events: auto;
}

.liquid-modal-window {
  width: 100%;
  max-width: 430px;
  background: var(--glass-modal-bg);
  backdrop-filter: var(--blur-modal);
  -webkit-backdrop-filter: var(--blur-modal);
  border: 1px solid var(--glass-border);
  border-radius: 28px;
  box-shadow: var(--shadow-modal), var(--glass-inner-highlight);
  padding: 24px;
  transform: scale(0.92) translateY(18px);
  opacity: 0;
  transition: transform var(--transition-smooth), opacity var(--transition-smooth);
  position: relative;
  overflow: hidden;
}

.liquid-modal-backdrop.is-active .liquid-modal-window {
  transform: scale(1) translateY(0);
  opacity: 1;
}

.modal-specular-edge {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 50%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0) 100%);
  pointer-events: none;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  position: relative;
  z-index: 2;
}

.modal-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--accent-color);
  background: rgba(0, 113, 227, 0.08);
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid rgba(0, 113, 227, 0.18);
}

.pulse-dot {
  width: 5.5px;
  height: 5.5px;
  border-radius: 50%;
  background: var(--accent-color);
  box-shadow: 0 0 6px var(--accent-color);
  animation: pulseDot 2s infinite ease-in-out;
}

@keyframes pulseDot {
  0%, 100% { opacity: 0.4; transform: scale(0.9); }
  50% { opacity: 1; transform: scale(1.15); }
}

.modal-close-btn {
  background: rgba(0, 0, 0, 0.04);
  border: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  cursor: pointer;
  transition: background var(--transition-fast), color var(--transition-fast);
}

.modal-close-btn:hover {
  background: rgba(0, 0, 0, 0.08);
  color: var(--text-primary);
}

.modal-title {
  font-size: 1.25rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
  color: var(--text-primary);
  position: relative;
  z-index: 2;
}

.modal-description {
  font-size: 0.88rem;
  line-height: 1.45;
  color: var(--text-secondary);
  margin-bottom: 20px;
  position: relative;
  z-index: 2;
}

.liquid-input-container {
  margin-bottom: 20px;
  position: relative;
  z-index: 2;
}

.liquid-input {
  width: 100%;
  border: 1px solid var(--glass-border-subtle);
  background: rgba(255, 255, 255, 0.45);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding: 12px 14px;
  border-radius: 14px;
  font-size: 0.92rem;
  color: var(--text-primary);
  outline: none;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02);
  transition: border-color var(--transition-fast), background var(--transition-fast);
}

.liquid-input:focus {
  border-color: rgba(0, 113, 227, 0.4);
  background: rgba(255, 255, 255, 0.65);
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  position: relative;
  z-index: 2;
}

.liquid-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 18px;
  border-radius: 12px;
  font-size: 0.88rem;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid transparent;
  outline: none;
  transition: transform var(--transition-fast), background var(--transition-fast);
}

.liquid-btn:active {
  transform: scale(0.96);
}

.btn-secondary {
  background: rgba(0, 0, 0, 0.04);
  color: var(--text-primary);
}

.btn-secondary:hover {
  background: rgba(0, 0, 0, 0.08);
}

.btn-primary {
  background: var(--accent-color);
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(0, 113, 227, 0.25);
}

.btn-primary:hover {
  background: #0077ed;
}
    </style>
</head>
<body>
  <!-- Ambient Atmospheric Lighting -->
  <div class="ambient-background">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <!-- Full-screen Desktop Viewport -->
  <main class="desktop-viewport">
    
    <!-- Top System Status Area -->
    <header class="status-bar">
      <div class="status-left">
        <span class="status-time" id="status-time">09:41</span>
      </div>
      <div class="status-right">
        <!-- Cellular Signal -->
        <svg class="sys-icon" viewBox="0 0 24 24">
          <line x1="4" y1="18" x2="4" y2="18.01"/>
          <line x1="9" y1="18" x2="9" y2="14"/>
          <line x1="14" y1="18" x2="14" y2="10"/>
          <line x1="19" y1="18" x2="19" y2="6"/>
        </svg>

        <!-- Wi-Fi -->
        <svg class="sys-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="18" r="0.8" fill="currentColor"/>
          <path d="M8 14.5a5.8 5.8 0 0 1 8 0"/>
          <path d="M4.8 11.2a10.2 10.2 0 0 1 14.4 0"/>
          <path d="M2 8a14.2 14.2 0 0 1 20 0"/>
        </svg>

        <!-- Battery -->
        <div class="battery-wrapper">
          <svg class="battery-svg" viewBox="0 0 26 13">
            <rect x="1" y="1" width="21" height="11" rx="3.2"/>
            <line x1="4" y1="6.5" x2="15" y2="6.5"/>
            <path d="M24 4.5v4"/>
          </svg>
        </div>
      </div>
    </header>

    <!-- Intermediate Application Icon Grid -->
    <section class="app-grid-container">
      <div class="app-grid">

        <!-- 1. Weather -->
        <button class="app-item" data-app-id="weather" data-title="Weather">
          <div class="icon-tile">
            <svg class="app-svg" viewBox="0 0 24 24">
              <path d="M16 16.5a3.8 3.8 0 0 0 .5-7.5 4.8 4.8 0 0 0-9.2-1.2A3.8 3.8 0 0 0 7 16.5z"/>
              <line x1="12" y1="2.5" x2="12" y2="4"/>
              <line x1="18.5" y1="5.2" x2="17.4" y2="6.3"/>
              <line x1="5.5" y1="5.2" x2="6.6" y2="6.3"/>
            </svg>
          </div>
          <span class="app-label">Weather</span>
        </button>

        <!-- 2. Calendar -->
        <button class="app-item" data-app-id="calendar" data-title="Calendar">
          <div class="icon-tile">
            <svg class="app-svg" viewBox="0 0 24 24">
              <rect x="3.5" y="5" width="17" height="15" rx="3.5"/>
              <line x1="3.5" y1="9.5" x2="20.5" y2="9.5"/>
              <line x1="8" y1="3" x2="8" y2="6"/>
              <line x1="16" y1="3" x2="16" y2="6"/>
              <circle cx="8" cy="13" r="0.75"/>
              <circle cx="12" cy="13" r="0.75"/>
              <circle cx="16" cy="13" r="0.75"/>
              <circle cx="8" cy="16.5" r="0.75"/>
              <circle cx="12" cy="16.5" r="0.75"/>
            </svg>
          </div>
          <span class="app-label">Calendar</span>
        </button>

        <!-- 3. Reminders -->
        <button class="app-item" data-app-id="reminders" data-title="Reminders">
          <div class="icon-tile">
            <svg class="app-svg" viewBox="0 0 24 24">
              <circle cx="6" cy="7" r="1.6"/>
              <line x1="10.5" y1="7" x2="19.5" y2="7"/>
              <circle cx="6" cy="12" r="1.6"/>
              <line x1="10.5" y1="12" x2="19.5" y2="12"/>
              <circle cx="6" cy="17" r="1.6"/>
              <line x1="10.5" y1="17" x2="19.5" y2="17"/>
            </svg>
          </div>
          <span class="app-label">Reminders</span>
        </button>

        <!-- 4. Memo (Notes) -->
        <button class="app-item" data-app-id="notes" data-title="Notes">
          <div class="icon-tile">
            <svg class="app-svg" viewBox="0 0 24 24">
              <path d="M5.5 4.5h8.5l4.5 4.5V19a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2z"/>
              <polyline points="14,4.5 14,9 18.5,9"/>
              <line x1="8" y1="13" x2="14" y2="13"/>
              <line x1="8" y1="16.5" x2="12" y2="16.5"/>
            </svg>
          </div>
          <span class="app-label">Notes</span>
        </button>

        <!-- 5. KakaoTalk -->
        <button class="app-item" data-app-id="kakaotalk" data-title="KakaoTalk">
          <div class="icon-tile">
            <svg class="app-svg" viewBox="0 0 24 24">
              <path d="M12 4.5c-4.7 0-8.5 3.3-8.5 7.4 0 2.6 1.6 4.9 4 6.2l-.9 3.2 3.6-1.8c.6.2 1.2.2 1.8.2 4.7 0 8.5-3.3 8.5-7.4S16.7 4.5 12 4.5z"/>
              <path d="M9 11v3m0-1.5h2m0-1.5v3"/>
              <path d="M14 11v3l2-3v3"/>
            </svg>
          </div>
          <span class="app-label">KakaoTalk</span>
        </button>

        <!-- 6. Schedule (Timeline) -->
        <button class="app-item" data-app-id="schedule" data-title="Schedule">
          <div class="icon-tile">
            <svg class="app-svg" viewBox="0 0 24 24">
              <circle cx="12" cy="12.5" r="8"/>
              <polyline points="12,8 12,12.5 15.5,14.5"/>
              <path d="M9.5 2.5h5"/>
            </svg>
          </div>
          <span class="app-label">Schedule</span>
        </button>

        <!-- 7. Music -->
        <button class="app-item" data-app-id="music" data-title="Music">
          <div class="icon-tile">
            <svg class="app-svg" viewBox="0 0 24 24">
              <circle cx="7.5" cy="16.5" r="2.5"/>
              <circle cx="17.5" cy="14.5" r="2.5"/>
              <path d="M10 16.5V6.8l10-2.2v9.9"/>
              <line x1="10" y1="10.2" x2="20" y2="8"/>
            </svg>
          </div>
          <span class="app-label">Music</span>
        </button>

        <!-- 8. Process Record (Workflow Log) -->
        <button class="app-item" data-app-id="workflow" data-title="Workflow Log">
          <div class="icon-tile">
            <svg class="app-svg" viewBox="0 0 24 24">
              <rect x="3.5" y="4" width="5" height="5" rx="1.5"/>
              <rect x="15.5" y="4" width="5" height="5" rx="1.5"/>
              <rect x="9.5" y="15" width="5" height="5" rx="1.5"/>
              <path d="M6 9v2.5a2 2 0 0 0 2 2h4"/>
              <path d="M18 9v2.5a2 2 0 0 1-2 2h-4"/>
              <line x1="12" y1="13.5" x2="12" y2="15"/>
            </svg>
          </div>
          <span class="app-label">Workflow</span>
        </button>

        <!-- 9. Academic Issues (Academic Notes) -->
        <button class="app-item" data-app-id="academic" data-title="Academic Notes">
          <div class="icon-tile">
            <svg class="app-svg" viewBox="0 0 24 24">
              <polygon points="12,4 21.5,8.5 12,13 2.5,8.5"/>
              <path d="M5.5 10v5.5c0 2 2.9 3.8 6.5 3.8s6.5-1.8 6.5-3.8V10"/>
              <line x1="21.5" y1="8.5" x2="21.5" y2="15"/>
            </svg>
          </div>
          <span class="app-label">Academic</span>
        </button>

        <!-- 10. Twitter -->
        <button class="app-item" data-app-id="twitter" data-title="Twitter">
          <div class="icon-tile">
            <svg class="app-svg" viewBox="0 0 24 24">
              <line x1="4.5" y1="4.5" x2="19.5" y2="19.5"/>
              <path d="M19.5 4.5l-6.8 7.3"/>
              <path d="M10.2 13.8l-5.7 5.7"/>
            </svg>
          </div>
          <span class="app-label">Twitter</span>
        </button>

        <!-- 11. Settings -->
        <button class="app-item" data-app-id="settings" data-title="Settings">
          <div class="icon-tile">
            <svg class="app-svg" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3"/>
              <path d="M10.3 3.3a1 1 0 0 1 3.4 0l.4 1a1 1 0 0 0 1.2.6l1.1-.4a1 1 0 0 1 2.4 2.4l-.4 1.1a1 1 0 0 0 .6 1.2l1 .4a1 1 0 0 1 0 3.4l-1 .4a1 1 0 0 0-.6 1.2l.4 1.1a1 1 0 0 1-2.4 2.4l-1.1-.4a1 1 0 0 0-1.2.6l-.4 1a1 1 0 0 1-3.4 0l-.4-1a1 1 0 0 0-1.2-.6l-1.1.4a1 1 0 0 1-2.4-2.4l.4-1.1a1 1 0 0 0-.6-1.2l-1-.4a1 1 0 0 1 0-3.4l1-.4a1 1 0 0 0 .6-1.2l-.4-1.1a1 1 0 0 1 2.4-2.4l1.1.4a1 1 0 0 0 1.2-.6l.4-1z"/>
            </svg>
          </div>
          <span class="app-label">Settings</span>
        </button>

        <!-- Dynamic Modal Action Simulator -->
        <button class="app-item action-sender" id="btn-open-composer" data-title="Direct Send">
          <div class="icon-tile active-trigger">
            <svg class="app-svg" viewBox="0 0 24 24">
              <path d="M20 4.5L3.5 11l6.5 2.5L12.5 20l7.5-15.5z"/>
              <line x1="10" y1="13.5" x2="15.5" y2="8.5"/>
            </svg>
          </div>
          <span class="app-label">Dispatch</span>
        </button>

      </div>
    </section>

    <!-- Bottom Dock Bar -->
    <footer class="dock-container">
      <div class="dock-glass">

        <!-- 12. Browser -->
        <button class="dock-item" data-app-id="browser" data-title="Browser">
          <div class="icon-tile">
            <svg class="app-svg" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="8.5"/>
              <polygon points="15.5,8.5 13,13 8.5,15.5 11,11"/>
            </svg>
          </div>
        </button>

        <!-- 13. iMessage -->
        <button class="dock-item" data-app-id="imessage" data-title="iMessage">
          <div class="icon-tile">
            <svg class="app-svg" viewBox="0 0 24 24">
              <path d="M12 4.5c-4.8 0-8.5 3.4-8.5 7.6 0 2.2 1 4.2 2.7 5.5l-.7 2.9 3.3-1.4c1 .4 2.1.6 3.2.6 4.8 0 8.5-3.4 8.5-7.6s-3.7-7.6-8.5-7.6z"/>
              <circle cx="8.5" cy="12" r="0.6"/>
              <circle cx="12" cy="12" r="0.6"/>
              <circle cx="15.5" cy="12" r="0.6"/>
            </svg>
          </div>
        </button>

        <!-- 14. Mail Box (Mail) -->
        <button class="dock-item" data-app-id="mail" data-title="Mail">
          <div class="icon-tile">
            <svg class="app-svg" viewBox="0 0 24 24">
              <rect x="3.5" y="5.5" width="17" height="13" rx="3"/>
              <polyline points="4.5,6.5 12,12.5 19.5,6.5"/>
            </svg>
          </div>

        <!-- 15. Photo Album (Photos) -->
        <button class="dock-item" data-app-id="photos" data-title="Photos">
          <div class="icon-tile">
            <svg class="app-svg" viewBox="0 0 24 24">
              <ellipse cx="12" cy="7.2" rx="2.5" ry="3.8"/>
              <ellipse cx="12" cy="16.8" rx="2.5" ry="3.8"/>
              <ellipse cx="7.2" cy="12" rx="3.8" ry="2.5"/>
              <ellipse cx="16.8" cy="12" rx="3.8" ry="2.5"/>
            </svg>
          </div>
        </button>

      </div>
      <!-- iOS Home Indicator -->
      <div class="home-indicator"></div>
    </footer>

    <!-- Liquid Glass Modal / Popover -->
    <aside class="liquid-modal-backdrop" id="liquid-modal" aria-hidden="true">
      <div class="liquid-modal-window">
        <div class="modal-specular-edge"></div>
        <div class="modal-header">
          <div class="modal-badge">
            <span class="pulse-dot"></span>
            <span>Liquid Session</span>
          </div>
          <button class="modal-close-btn" id="modal-close" aria-label="Close">
            <svg viewBox="0 0 24 24" class="sys-icon">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <div class="modal-body">
          <h3 class="modal-title" id="modal-title">Linear Session Ready</h3>
          <p class="modal-description" id="modal-desc">
            All system elements are synchronized. Ready for message dispatch.
          </p>
          <div class="liquid-input-container">
            <input type="text" class="liquid-input" id="message-input" placeholder="Type instruction or payload..." />
          </div>
        </div>

        <div class="modal-footer">
          <button class="liquid-btn btn-secondary" id="btn-cancel">Dismiss</button>
          <button class="liquid-btn btn-primary" id="btn-send">
            <span>Send</span>
            <svg class="sys-icon" viewBox="0 0 24 24" style="width: 14px; height: 14px;">
              <line x1="4" y1="12" x2="20" y2="12"/>
              <polyline points="14,6 20,12 14,18"/>
            </svg>
          </button>
        </div>
      </div>
    </aside>

  </main>

<script>
        /**
 * iOS Liquid Glass Desktop Front-End Controller
 * Responsibilities:
 *  1. Status bar clock auto-synchronization
 *  2. Application invocation & Liquid Glass modal lifecycle
 *  3. Dispatch modal trigger simulation
 */

document.addEventListener("DOMContentLoaded", () => {
  // --- 1. Real-Time Status Clock ---
  const timeElement = document.getElementById("status-time");

  const syncClock = () => {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, "0");
    const minutes = String(now.getMinutes()).padStart(2, "0");
    timeElement.textContent = `${hours}:${minutes}`;
  };

  syncClock();
  setInterval(syncClock, 1000 * 30);

  // --- 2. Modal Controller & Dynamic Dispatch State ---
  const modalBackdrop = document.getElementById("liquid-modal");
  const modalTitle = document.getElementById("modal-title");
  const modalDesc = document.getElementById("modal-desc");
  const messageInput = document.getElementById("message-input");
  const btnClose = document.getElementById("modal-close");
  const btnCancel = document.getElementById("btn-cancel");
  const btnSend = document.getElementById("btn-send");
  const btnOpenComposer = document.getElementById("btn-open-composer");

  /**
   * Opens the Liquid Glass Modal
   * @param {string} title
   * @param {string} description
   * @param {string} placeholder
   */
  const openModal = (title, description, placeholder = "") => {
    modalTitle.textContent = title;
    modalDesc.textContent = description;
    messageInput.placeholder = placeholder || "Enter command or message...";
    messageInput.value = "";

    modalBackdrop.classList.add("is-active");
    modalBackdrop.setAttribute("aria-hidden", "false");

    setTimeout(() => {
      messageInput.focus();
    }, 120);
  };

  /**
   * Closes the Liquid Glass Modal
   */
  const closeModal = () => {
    modalBackdrop.classList.remove("is-active");
    modalBackdrop.setAttribute("aria-hidden", "true");
    messageInput.blur();
  };

  // Close triggers
  btnClose.addEventListener("click", closeModal);
  btnCancel.addEventListener("click", closeModal);

  // Dismiss on backdrop click
  modalBackdrop.addEventListener("click", (e) => {
    if (e.target === modalBackdrop) {
      closeModal();
    }
  });

  // Dismiss on ESC
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modalBackdrop.classList.contains("is-active")) {
      closeModal();
    }
  });

  // --- 3. Active Sending Simulation ---
  btnOpenComposer.addEventListener("click", () => {
    openModal(
      "Direct Dispatch",
      "Immediate sending pipeline initialized. State is linked to the glass core.",
      "Type message to broadcast..."
    );
  });

  btnSend.addEventListener("click", () => {
    const payload = messageInput.value.trim();
    if (!payload) {
      messageInput.focus();
      return;
    }

    // Pipeline hook reserved for future API/Chat features
    console.log(`[Liquid Desktop] Dispatched:`, payload);

    btnSend.textContent = "Sent";
    setTimeout(() => {
      btnSend.innerHTML = `
        <span>Send</span>
        <svg class="sys-icon" viewBox="0 0 24 24" style="width: 14px; height: 14px;">
          <line x1="4" y1="12" x2="20" y2="12"/>
          <polyline points="14,6 20,12 14,18"/>
        </svg>
      `;
      closeModal();
    }, 400);
  });

  // --- 4. Application Invocation ---
  const allApps = document.querySelectorAll(".app-item:not(.action-sender), .dock-item");

  allApps.forEach((app) => {
    app.addEventListener("click", () => {
      const appId = app.getAttribute("data-app-id");
      const appTitle = app.getAttribute("data-title") || appId;

      openModal(
        appTitle,
        `Liquid session started for ${appTitle}. Minimalist frame is ready for future module mounting.`,
        `Query ${appTitle}...`
      );
    });
  });
});
    </script>

</body>
