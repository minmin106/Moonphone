<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liquid Glass UI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; padding: 0; height: 100vh; overflow: hidden; 
            /* 用一个高对比度、色彩丰富的模糊背景来凸显玻璃质感 */
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* 手机全屏容器 */
        #phone { 
            width: 100vw; height: 100vh; position: relative; 
            display: flex; flex-direction: column; padding: 0 20px;
            /* 整体加一层极暗的遮罩，让白色文字和图标更清晰 */
            background: rgba(0, 0, 0, 0.4);
        }

        /* 1. Status Bar & Dynamic Pill (状态栏与灵动岛) */
        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 10px 0; color: #fff; font-size: 14px; font-weight: 600; z-index: 100;
        }
        /* 灵动岛 */
        .dynamic-pill {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            width: 120px; height: 35px; background: #000; border-radius: 20px;
            box-shadow: inset 0 0 2px rgba(255,255,255,0.1), 0 4px 10px rgba(0,0,0,0.3);
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .dynamic-pill::before, .dynamic-pill::after {
            content: ''; width: 6px; height: 6px; border-radius: 50%; background: #333;
        }

        /* 2. Upper Widget Zone (上方双 2x2 小组件) */
        .widget-zone { display: flex; gap: 15px; margin-top: 35px; }
        .widget-card {
            flex: 1; height: 160px; border-radius: 24px;
            /* 核心：液态玻璃质感 */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            /* 顶部高光，底部阴影，形成立体感 */
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.5), 0 10px 20px rgba(0,0,0,0.15);
            padding: 15px; display: flex; flex-direction: column; justify-content: center; color: #fff;
        }
        .widget-card h3 { font-size: 18px; margin-bottom: 5px; font-weight: 500;}
        .widget-card p { font-size: 12px; color: rgba(255,255,255,0.6); }

        /* 3. Floating Glass Banner (悬浮胶囊通知) */
        .floating-banner {
            margin: 20px auto; width: 90%; padding: 12px 20px; border-radius: 30px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2), inset 0 1px 1px rgba(255,255,255,0.4);
            color: #fff; font-size: 13px; text-align: center;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }

        /* 4. Central App Icon Grid (中央图标网格) */
        .app-grid { 
            display: grid; grid-template-columns: repeat(4, 1fr); 
            gap: 20px 15px; margin-top: 20px; flex: 1; align-content: start;
        }
        .app-icon { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer;}
        .app-icon:active { transform: scale(0.9); transition: 0.1s; }
        
        /* 拟物+玻璃图标 */
        .icon-box {
            width: 60px; height: 60px; border-radius: 22%; /* 连续圆角感 */
            /* 玻璃底座 */
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.05) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2), inset 0 1px 1px rgba(255,255,255,0.4);
            display: flex; justify-content: center; align-items: center; font-size: 28px;
        }
        .app-name { font-size: 11px; color: #fff; font-weight: 500; }

        /* 5. Page Indicator Dots (页面指示器) */
        .page-dots { display: flex; justify-content: center; gap: 6px; margin: 15px 0; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.3); }
        .dot.active { background: #fff; }

        /* 6. Bottom Floating Glass Dock (底部悬浮玻璃 Dock) */
        .dock {
            margin-bottom: 25px; width: 100%; height: 80px; border-radius: 35px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2), inset 0 1px 3px rgba(255,255,255,0.5);
            display: flex; justify-content: space-around; align-items: center; padding: 0 10px;
        }
        .dock .icon-box { box-shadow: none; border: none; background: transparent; font-size: 35px;}

        /* 7. Home Indicator Bar (底部主页横条) */
        .home-bar {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            width: 130px; height: 5px; border-radius: 10px; background: #fff;
        }
    </style>
</head>
<body>

    <div id="phone">
        <!-- 1. Status Bar & Dynamic Pill -->
        <div class="status-bar">
            <span>09:41</span>
            <div class="dynamic-pill"></div>
            <span>5G 🔋</span>
        </div>

        <!-- 2. Upper Widget Zone -->
        <div class="widget-zone">
            <div class="widget-card">
                <h3>26°</h3>
                <p>晴转多云 / 空气优</p>
            </div>
            <div class="widget-card">
                <h3>专注中</h3>
                <p>剩余 45 分钟</p>
            </div>
        </div>

        <!-- 3. Floating Glass Banner -->
        <div class="floating-banner">
            <span>✨</span> 阿月发来了一条新消息...
        </div>

        <!-- 4. Central App Icon Grid -->
        <div class="app-grid">
            <div class="app-icon">
                <div class="icon-box" style="background: rgba(254, 229, 0, 0.8);">💬</div>
                <div class="app-name">KakaoTalk</div>
            </div>
            <div class="app-icon">
                <div class="icon-box">⚙️</div>
                <div class="app-name">设置</div>
            </div>
            <div class="app-icon">
                <div class="icon-box">🖼️</div>
                <div class="app-name">相册</div>
            </div>
            <div class="app-icon">
                <div class="icon-box" style="background: #000; color: #fff;">𝕏</div>
                <div class="app-name">Twitter</div>
            </div>
            <!-- 留空几个占位，展现排版节奏 -->
            <div class="app-icon"><div class="icon-box" style="opacity: 0.5;"></div></div>
            <div class="app-icon"><div class="icon-box" style="opacity: 0.5;"></div></div>
        </div>

        <!-- 5. Page Indicator Dots -->
        <div class="page-dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <!-- 6. Bottom Floating Glass Dock -->
        <div class="dock">
            <div class="icon-box">📞</div>
            <div class="icon-box">🌐</div>
            <div class="icon-box">🎵</div>
            <div class="icon-box">✉️</div>
        </div>

        <!-- 7. Home Indicator Bar -->
        <div class="home-bar"></div>
    </div>

</body>
</html>
