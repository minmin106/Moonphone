<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iOS Liquid Glass Home Screen - Pure Visual Specification</title>
  <style>
    /* ==========================================================================
       1. COLOR SYSTEM & CSS VARIABLES
       ========================================================================== */
    :root {
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      --squircle-radius: 22.5%;
      --transition-speed: 0.4s;
      --transition-timing: cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Light Mode Specification */
    [data-theme="light"] {
      --bg-gradient: radial-gradient(circle at 10% 20%, #eff2f7 0%, #e2e7f0 45%, #d5dde8 100%),
                     linear-gradient(135deg, #e4ecf7 0%, #f7f9fc 50%, #dce4ef 100%);
      --wallpaper-glow-1: rgba(106, 169, 244, 0.18);
      --wallpaper-glow-2: rgba(220, 160, 72, 0.12);

      --glass-base: rgba(255, 255, 255, 0.52);
      --glass-elevated: rgba(255, 255, 255, 0.68);
      --glass-dock: rgba(255, 255, 255, 0.62);

      --specular-top: rgba(255, 255, 255, 0.85);
      --specular-bottom: rgba(0, 0, 0, 0.08);
      --inner-refraction: inset 0 1px 1.5px rgba(255, 255, 255, 0.65);

      --shadow-soft: 0 14px 34px -6px rgba(0, 0, 0, 0.08), 0 3px 8px rgba(0, 0, 0, 0.04);
      --shadow-dock: 0 20px 48px -8px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.04);

      --text-primary: #1C1D21;
      --text-secondary: #7A7E85;
      --text-shadow: 0 1px 2px rgba(255, 255, 255, 0.4);

      --accent-blue: #3388E8;
      --accent-mint: #5EA88D;
      --accent-rose: #D47672;
      --accent-amber: #DCA048;

      --dynamic-island-bg: #000000;
      --home-indicator: rgba(0, 0, 0, 0.28);
      --status-color: #1C1D21;
    }

    /* Dark Mode Specification */
    [data-theme="dark"] {
      --bg-gradient: radial-gradient(circle at 15% 15%, #181b22 0%, #0d0e12 55%, #08090b 100%),
                     linear-gradient(135deg, #101217 0%, #171a22 60%, #0a0b0e 100%);
      --wallpaper-glow-1: rgba(69, 146, 247, 0.15);
      --wallpaper-glow-2: rgba(155, 141, 242, 0.12);

      --glass-base: rgba(28, 30, 36, 0.46);
      --glass-elevated: rgba(38, 41, 50, 0.52);
      --glass-dock: rgba(30, 32, 40, 0.58);

      --specular-top: rgba(255, 255, 255, 0.34);
      --specular-bottom: rgba(0, 0, 0, 0.35);
      --inner-refraction: inset 0 1px 1px rgba(255, 255, 255, 0.24);

      --shadow-soft: 0 16px 38px -6px rgba(0, 0, 0, 0.48), 0 4px 10px rgba(0, 0, 0, 0.28);
      --shadow-dock: 0 24px 52px -6px rgba(0, 0, 0, 0.65), 0 6px 14px rgba(0, 0, 0, 0.35);

      --text-primary: #F2F4F7;
      --text-secondary: #8E929B;
      --text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);

      --accent-blue: #4592F7;
      --accent-mint: #52B495;
      --accent-rose: #DE7E7A;
      --accent-amber: #CBB07E;

      --dynamic-island-bg: #000000;
      --home-indicator: rgba(255, 255, 255, 0.45);
      --status-color: #F2F4F7;
    }

    /* ==========================================================================
       2. GLOBAL PAGE & FRAMEWORK RESET
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050608;
      font-family: var(--font-family);
      padding: 24px;
      color: var(--text-primary);
    }

    /* Light / Dark Mode Visual Switcher */
    .theme-controller {
      position: fixed;
      top: 20px;
      z-index: 999;
      display: flex;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      padding: 4px;
      gap: 4px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .theme-btn {
      border: none;
      background: transparent;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #FFFFFF;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .theme-btn.active {
      background: #FFFFFF;
      color: #000000;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    /* ==========================================================================
       3. DEVICE HARDWARE CHASSIS SIMULATION
       ========================================================================== */
    .device-viewport {
      position: relative;
      width: 393px;
      height: 852px;
      border-radius: 54px;
      overflow: hidden;
      background: var(--bg-gradient);
      box-shadow: 0 0 0 11px #1a1b1e,
                  0 0 0 13px #282a30,
                  0 30px 80px rgba(0, 0, 0, 0.8);
      transition: background var(--transition-speed) var(--transition-timing);
    }

    /* Soft Chromatic Wallpaper Elements */
    .device-viewport::before,
    .device-viewport::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(65px);
      pointer-events: none;
      z-index: 1;
      transition: all var(--transition-speed) var(--transition-timing);
    }

    .device-viewport::before {
      top: 15%;
      left: 10%;
      width: 280px;
      height: 280px;
      background: var(--wallpaper-glow-1);
    }

    .device-viewport::after {
      bottom: 25%;
      right: 5%;
      width: 240px;
      height: 240px;
      background: var(--wallpaper-glow-2);
    }

    /* Screen Canvas */
    .home-screen {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      padding: 0 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* ==========================================================================
       4. TEXTURE ARCHITECTURE (LIQUID GLASS RULES)
       ========================================================================== */
    .liquid-glass {
      background: var(--glass-base);
      backdrop-filter: blur(34px) saturate(175%);
      -webkit-backdrop-filter: blur(34px) saturate(175%);
      border-top: 0.8px solid var(--specular-top);
      border-left: 0.5px solid var(--specular-top);
      border-right: 0.5px solid var(--specular-bottom);
      border-bottom: 0.8px solid var(--specular-bottom);
      box-shadow: var(--inner-refraction), var(--shadow-soft);
      transition: background var(--transition-speed) var(--transition-timing),
                  border var(--transition-speed) var(--transition-timing),
                  box-shadow var(--transition-speed) var(--transition-timing);
    }

    /* ==========================================================================
       5. SECTION 1: STATUS BAR & DYNAMIC PILL
       ========================================================================== */
    .status-bar {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--status-color);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.3px;
      padding: 0 10px;
      margin-top: 4px;
      z-index: 10;
    }

    .dynamic-island {
      width: 120px;
      height: 35px;
      background: var(--dynamic-island-bg);
      border-radius: 20px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 11px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .status-glyphs {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-glyphs svg {
      fill: currentColor;
    }

    /* ==========================================================================
       6. SECTION 2: UPPER WIDGET ZONE (DUAL 2x2 LIQUID GLASS CARDS)
       ========================================================================== */
    .widget-zone {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 14px;
    }

    .widget-2x2 {
      height: 155px;
      border-radius: 26px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .widget-header {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .widget-badge {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .widget-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.2px;
    }

    .metric-primary {
      font-size: 34px;
      font-weight: 300;
      letter-spacing: -1px;
      color: var(--text-primary);
      line-height: 1.1;
    }

    .metric-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Sub-surface graph line simulation */
    .mini-chart {
      height: 24px;
      width: 100%;
      display: flex;
      align-items: flex-end;
      gap: 4px;
    }

    .chart-bar {
      flex: 1;
      border-radius: 3px;
      background: var(--accent-blue);
      opacity: 0.35;
    }

    .chart-bar.highlight {
      opacity: 0.9;
    }

    /* Ring Indicator Simulation */
    .ring-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .progress-ring {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--accent-mint);
      border-right-color: var(--accent-mint);
      transform: rotate(45deg);
    }

    /* ==========================================================================
       7. SECTION 3: FLOATING TRANSIENT CAPSULE (OVERLAY BANNER)
       ========================================================================== */
    .transient-capsule-zone {
      margin-top: 14px;
      width: 100%;
    }

    .transient-capsule {
      height: 46px;
      border-radius: 23px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--glass-elevated);
      backdrop-filter: blur(40px) saturate(190%);
      -webkit-backdrop-filter: blur(40px) saturate(190%);
    }

    .capsule-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-blue), #2c5ba8);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      flex-shrink: 0;
    }

    .capsule-icon svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .capsule-text {
      flex: 1;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .capsule-accent {
      color: var(--accent-blue);
      font-weight: 600;
    }

    /* ==========================================================================
       8. SECTION 4: CENTRAL APP ICON GRID
       ========================================================================== */
    .icon-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      row-gap: 18px;
      column-gap: 20px;
      margin-top: 16px;
    }

    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-icon {
      width: 60px;
      height: 60px;
      border-radius: var(--squircle-radius);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16);
      border-top: 0.8px solid var(--specular-top);
      border-bottom: 0.8px solid var(--specular-bottom);
    }

    .app-icon svg {
      width: 28px;
      height: 28px;
      position: relative;
      z-index: 2;
    }

    /* App Micro-Gradients & Low-Saturation Tints */
    .icon-bg-blue   { background: linear-gradient(145deg, rgba(69, 146, 247, 0.85), rgba(40, 80, 160, 0.75)); fill: #FFFFFF; }
    .icon-bg-slate  { background: linear-gradient(145deg, rgba(142, 146, 155, 0.85), rgba(70, 75, 85, 0.75)); fill: #FFFFFF; }
    .icon-bg-mint   { background: linear-gradient(145deg, rgba(94, 168, 141, 0.85), rgba(45, 100, 80, 0.75)); fill: #FFFFFF; }
    .icon-bg-rose   { background: linear-gradient(145deg, rgba(222, 126, 122, 0.85), rgba(150, 65, 65, 0.75)); fill: #FFFFFF; }
    .icon-bg-amber  { background: linear-gradient(145deg, rgba(203, 176, 126, 0.85), rgba(135, 110, 60, 0.75)); fill: #FFFFFF; }
    .icon-bg-violet { background: linear-gradient(145deg, rgba(155, 141, 242, 0.85), rgba(90, 75, 170, 0.75)); fill: #FFFFFF; }
    .icon-bg-glass  { background: var(--glass-elevated); backdrop-filter: blur(25px); fill: var(--text-primary); }

    .app-label {
      margin-top: 6px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-primary);
      text-shadow: var(--text-shadow);
      text-align: center;
      letter-spacing: -0.1px;
    }

    /* ==========================================================================
       9. SECTION 5: PAGE INDICATOR DOTS
       ========================================================================== */
    .page-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin: 12px 0 6px 0;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-primary);
      opacity: 0.28;
      transition: all var(--transition-speed);
    }

    .dot.active {
      width: 14px;
      border-radius: 4px;
      opacity: 0.85;
      background: var(--text-primary);
    }

    /* ==========================================================================
       10. SECTION 6 & 7: BOTTOM FLOATING GLASS DOCK & HOME INDICATOR
       ========================================================================== */
    .dock-container {
      margin-bottom: 24px;
    }

    .dock {
      height: 84px;
      border-radius: 36px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: var(--glass-dock);
      backdrop-filter: blur(44px) saturate(200%);
      -webkit-backdrop-filter: blur(44px) saturate(200%);
      border-top: 1px solid var(--specular-top);
      border-bottom: 0.8px solid var(--specular-bottom);
      box-shadow: var(--inner-refraction), var(--shadow-dock);
    }

    .dock .app-item {
      margin-top: 0;
    }

    .home-indicator-bar {
      width: 134px;
      height: 5px;
      border-radius: 3px;
      background: var(--home-indicator);
      margin: 0 auto 8px auto;
    }
  </style>
</head>
<body>

  <!-- Floating Light/Dark Mode Visual Theme Controller -->
  <aside class="theme-controller" aria-label="Visual Mode Selection">
    <button class="theme-btn" id="btnLight">Light</button>
    <button class="theme-btn active" id="btnDark">Dark</button>
  </aside>

  <!-- iPhone Visual Hardware Boundary -->
  <main class="device-viewport">
    <div class="home-screen">

      <!-- TOP: 1. Status Bar & Dynamic Pill -->
      <header>
        <div class="status-bar">
          <time datetime="09:41">09:41</time>
          <div class="dynamic-island" aria-hidden="true"></div>
          <div class="status-glyphs" aria-label="Status Icons">
            <!-- Cellular Signal -->
            <svg width="17" height="11" viewBox="0 0 17 11">
              <rect x="0" y="8" width="3" height="3" rx="0.8"/>
              <rect x="4.5" y="5.5" width="3" height="5.5" rx="0.8"/>
              <rect x="9" y="3" width="3" height="8" rx="0.8"/>
              <rect x="13.5" y="0" width="3" height="11" rx="0.8"/>
            </svg>
            <!-- Wi-Fi Arc -->
            <svg width="16" height="12" viewBox="0 0 16 12">
              <path d="M8 9.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3zm-4.2-2.8a6 6 0 018.4 0 .8.8 0 001.1-1.1 7.5 7.5 0 00-10.6 0 .8.8 0 001.1 1.1zm-2.8-2.8a10 10 0 0114 0 .8.8 0 101.1-1.1 11.5 11.5 0 00-16.2 0 .8.8 0 101.1 1.1z"/>
            </svg>
            <!-- Battery Outline -->
            <svg width="24" height="11" viewBox="0 0 24 11">
              <rect x="0.5" y="0.5" width="20" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
              <rect x="2" y="2" width="14" height="7" rx="1.5"/>
              <path d="M22 3.5v4" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
      </header>

      <!-- UPPER: 2. Widget Zone (Dual 2x2 Glass Modules) -->
      <section class="widget-zone" aria-label="Home Screen Widgets">
        <!-- Weather / Dual Metrics Widget -->
        <article class="widget-2x2 liquid-glass">
          <div class="widget-header">
            <span class="widget-badge" style="background: var(--accent-blue);">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M12 2a10 10 0 100 20 10 10 0 000-20z"/></svg>
            </span>
            <span class="widget-title">Weather</span>
          </div>
          <div>
            <div class="metric-primary">18°</div>
            <div class="metric-sub">Paris · Cloudy</div>
          </div>
          <div class="mini-chart">
            <div class="chart-bar" style="height: 40%;"></div>
            <div class="chart-bar" style="height: 60%;"></div>
            <div class="chart-bar highlight" style="height: 85%;"></div>
            <div class="chart-bar" style="height: 55%;"></div>
            <div class="chart-bar" style="height: 35%;"></div>
          </div>
        </article>

        <!-- Milestone & Schedule Widget -->
        <article class="widget-2x2 liquid-glass">
          <div class="widget-header">
            <span class="widget-badge" style="background: var(--accent-mint);">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2zm0 16H5V8h14v12z"/></svg>
            </span>
            <span class="widget-title">Schedule</span>
          </div>
          <div class="ring-container">
            <div class="progress-ring"></div>
            <div>
              <div class="metric-primary" style="font-size: 24px;">D-14</div>
              <div class="metric-sub">Anniversary</div>
            </div>
          </div>
          <div class="metric-sub" style="font-size: 11px;">Both Available: 19:30</div>
        </article>
      </section>

      <!-- OVERLAY: 3. Floating Transient Capsule -->
      <section class="transient-capsule-zone" aria-label="Floating Banner">
        <div class="transient-capsule liquid-glass">
          <div class="capsule-icon">
            <svg viewBox="0 0 24 24">
              <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
          </div>
          <div class="capsule-text">
            <span class="capsule-accent">Invitation:</span> Debussy - Clair de Lune
          </div>
        </div>
      </section>

      <!-- CENTER: 4. Central 4-Column Icon Grid -->
      <section class="icon-grid" aria-label="Applications">
        <!-- Calendar -->
        <div class="app-item">
          <div class="app-icon icon-bg-rose">
            <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
          </div>
          <span class="app-label">Calendar</span>
        </div>

        <!-- Reminders -->
        <div class="app-item">
          <div class="app-icon icon-bg-amber">
            <svg viewBox="0 0 24 24"><path d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm0-6c-.83 0-1.5.67-1.5 1.5S3.17 7.5 4 7.5 5.5 6.83 5.5 6 4.83 4.5 4 4.5zm0 12c-.83 0-1.5.68-1.5 1.5s.68 1.5 1.5 1.5 1.5-.68 1.5-1.5-.67-1.5-1.5-1.5zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-8v2h14V5H7z"/></svg>
          </div>
          <span class="app-label">Reminders</span>
        </div>

        <!-- Notes -->
        <div class="app-item">
          <div class="app-icon icon-bg-slate">
            <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
          </div>
          <span class="app-label">Notes</span>
        </div>

        <!-- Photos -->
        <div class="app-item">
          <div class="app-icon icon-bg-mint">
            <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
          </div>
          <span class="app-label">Photos</span>
        </div>

        <!-- Weather -->
        <div class="app-item">
          <div class="app-icon icon-bg-blue">
            <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
          </div>
          <span class="app-label">Weather</span>
        </div>

        <!-- Process Log -->
        <div class="app-item">
          <div class="app-icon icon-bg-violet">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
          </div>
          <span class="app-label">Process Log</span>
        </div>

  <!-- Interactive Light / Dark Toggle Script -->
  <script>
    const btnLight = document.getElementById('btnLight');
    const btnDark = document.getElementById('btnDark');
    const root = document.documentElement;

    btnLight.addEventListener('click', () => {
      root.setAttribute('data-theme', 'light');
      btnLight.classList.add('active');
      btnDark.classList.remove('active');
    });

    btnDark.addEventListener('click', () => {
      root.setAttribute('data-theme', 'dark');
      btnDark.classList.add('active');
      btnLight.classList.remove('active');
    });
  </script>
