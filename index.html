<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>iOS Liquid Glass Desktop</title>
  <style>
    /* ==========================================================================
       CSS VARIABLES & LIQUID GLASS SPECIFICATIONS
       ========================================================================== */
    :root {
      /* Translucent Liquid Glass Materials */
      --glass-bg-base: rgba(255, 255, 255, 0.16);
      --glass-bg-hover: rgba(255, 255, 255, 0.28);
      --glass-dock-bg: rgba(255, 255, 255, 0.2);
      --glass-modal-bg: rgba(248, 250, 252, 0.45);

      /* Specular Edges & Borders */
      --glass-border: rgba(255, 255, 255, 0.42);
      --glass-border-subtle: rgba(255, 255, 255, 0.2);
      --glass-inner-highlight: inset 0 1px 1px rgba(255, 255, 255, 0.7),
                               inset 0 -1px 1px rgba(255, 255, 255, 0.15);

      /* Blur Engine */
      --blur-surface: blur(30px) saturate(180%);
      --blur-dock: blur(36px) saturate(200%);
      --blur-modal: blur(48px) saturate(210%);

      /* Ambient Shadows */
      --shadow-tile: 0 8px 24px -4px rgba(20, 24, 38, 0.06),
                     0 2px 6px -1px rgba(20, 24, 38, 0.03);
      --shadow-dock: 0 18px 42px -6px rgba(20, 24, 38, 0.1),
                     0 2px 6px rgba(0, 0, 0, 0.03);
      --shadow-modal: 0 32px 64px -12px rgba(10, 15, 30, 0.22);

      /* Typography & Strokes */
      --text-primary: rgba(18, 22, 30, 0.86);
      --text-secondary: rgba(18, 22, 30, 0.52);
      --accent-color: #0071e3;
      --icon-stroke-color: rgba(22, 26, 35, 0.82);

      /* Geometry & Scaling */
      --icon-size: clamp(56px, 7vw, 66px);
      --icon-radius: clamp(16px, 2vw, 19px);
      --dock-radius: clamp(26px, 3.5vw, 36px);
      --grid-gap: clamp(18px, 3vw, 36px);

      /* Transitions */
      --ease-liquid: cubic-bezier(0.16, 1, 0.3, 1);
      --transition-fast: 0.22s var(--ease-liquid);
      --transition-smooth: 0.4s var(--ease-liquid);
    }

    /* Base Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Remove default underscore and blue text color for anchor tags */
    a {
      text-decoration: none;
      color: inherit;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
                   "Helvetica Neue", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background-color: #e2e6eb;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ==========================================================================
       AMBIENT ATMOSPHERE
       ========================================================================== */
    .ambient-background {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: linear-gradient(135deg, #e4ebf3 0%, #d5e0ec 50%, #dce5ec 100%);
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.58;
    }

    .orb-1 {
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(168, 198, 232, 0.7) 0%, rgba(180, 215, 245, 0) 70%);
      top: -80px;
      right: -60px;
    }

    .orb-2 {
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(235, 208, 222, 0.6) 0%, rgba(235, 210, 225, 0) 70%);
      bottom: -40px;
      left: -80px;
    }

    .orb-3 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(198, 228, 222, 0.5) 0%, rgba(198, 228, 222, 0) 70%);
      top: 35%;
      left: 28%;
    }

    /* ==========================================================================
       VIEWPORT & STATUS BAR (REDRAWN LINEAR ICONS)
       ========================================================================== */
    .desktop-viewport {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 10px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 8px) env(safe-area-inset-left, 16px);
      max-width: 1280px;
      margin: 0 auto;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 44px;
      padding: 0 20px;
      font-size: 0.94rem;
      letter-spacing: -0.01em;
    }

    .status-left {
      display: flex;
      align-items: center;
    }

    .status-time {
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .status-right {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    /* Minimalist Linear System SVGs */
    .sys-icon {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* Redesigned iOS Style Battery Wrapper */
    .battery-group {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .battery-percent {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      line-height: 1;
    }

    .battery-svg {
      width: 25px;
      height: 12px;
      overflow: visible;
      display: block;
    }

    /* ==========================================================================
       APP GRID & LIQUID GLASS ICONS
       ========================================================================== */
    .app-grid-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 0;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .app-grid-container::-webkit-scrollbar {
      display: none;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--grid-gap);
      padding: 16px;
      max-width: 480px;
      width: 100%;
      margin: auto;
    }

    @media (min-width: 768px) {
      .app-grid {
        grid-template-columns: repeat(5, 1fr);
        max-width: 720px;
      }
    }

    @media (min-width: 1024px) {
      .app-grid {
        grid-template-columns: repeat(5, 1fr);
        max-width: 800px;
      }
    }

    /* App item anchor styling */
    .app-item {
      text-decoration: none;
      color: inherit;
      background: none;
      border: none;
      outline: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: transform var(--transition-fast);
    }

    .app-item:active {
      transform: scale(0.92);
    }

    .icon-tile {
      width: var(--icon-size);
      height: var(--icon-size);
      border-radius: var(--icon-radius);
      background: var(--glass-bg-base);
      backdrop-filter: var(--blur-surface);
      -webkit-backdrop-filter: var(--blur-surface);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-tile), var(--glass-inner-highlight);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--icon-stroke-color);
      position: relative;
      overflow: hidden;
      transition: background var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .icon-tile::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 44%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.42) 0%, rgba(255, 255, 255) 100%);
      border-radius: var(--icon-radius) var(--icon-radius) 0 0;
      pointer-events: none;
    }

    .app-item:hover .icon-tile,
    .dock-item:hover .icon-tile {
      background: var(--glass-bg-hover);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 0 10px 26px -3px rgba(20, 24, 38, 0.09), var(--glass-inner-highlight);
    }

    /* Strict Minimalist Linear App SVG Rules */
    .app-svg {
      width: 50%;
      height: 50%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
      position: relative;
      z-index: 1;
    }

    .app-label {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
      white-space: nowrap;
      pointer-events: none;
    }

    /* ==========================================================================
       BOTTOM DOCK
       ========================================================================== */
    .dock-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding-bottom: 6px;
    }

    .dock-glass {
      background: var(--glass-dock-bg);
      backdrop-filter: var(--blur-dock);
      -webkit-backdrop-filter: var(--blur-dock);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-dock), var(--glass-inner-highlight);
      border-radius: var(--dock-radius);
      padding: clamp(10px, 1.6vw, 15px);
      display: flex;
      align-items: center;
      gap: clamp(12px, 2.2vw, 24px);
      position: relative;
      overflow: hidden;
    }

    .dock-glass::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 48%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.38) 0%, rgba(255, 255, 255, 0) 100%);
      border-radius: var(--dock-radius) var(--dock-radius) 0 0;
      pointer-events: none;
    }

    .dock-item {
      text-decoration: none;
      color: inherit;
      background: none;
      border: none;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform var(--transition-fast);
    }

    .dock-item:active {
      transform: scale(0.9);
    }

    .home-indicator {
      width: 132px;
      height: 4px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 99px;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- Ambient Dynamic Lighting -->
  <div class="ambient-background">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <!-- Fullscreen Desktop Shell -->
  <main class="desktop-viewport">
    
    <!-- Top System Status Area -->
    <header class="status-bar">
      <div class="status-left">

      <div class="status-right">

        <svg class="sys-icon" viewBox="0 0 24 24">
          <line x1="4" y1="18" x2="4" y2="18.01"/>
          <line x1="9" y1="18" x2="9" y2="14"/>
          <line x1="14" y1="18" x2="14" y2="10"/>
          <line x1="19" y1="18" x2="19" y2="6"/>
        </svg>

        <!-- Wi-Fi -->
        <svg class="sys-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="18" r="0.8" fill="currentColor"/>
          <path d="M8 14.5a5.8 5.8 0 0 1 8 0"/>
          <path d="M4.8 11.2a10.2 10.2 0 0 1 14.4 0"/>
          <path d="M2 8a14.2 14.2 0 0 1 20 0"/>
        </svg>

        <!-- Redrawn Minimalist iOS Battery -->
        <div class="battery-group">
          <span class="battery-percent" id="battery-percent">88%</span>
          <svg class="battery-svg" viewBox="0 0 27 13" fill="none">
            <rect x="0.7" y="0.7" width="22" height="11.6" rx="3.6" stroke="currentColor" stroke-width="1.35"/>
            <rect x="2.6" y="2.6" width="13.2" height="7.8" rx="2" fill="currentColor"/>
            <path d="M24.5 4.8C25.2 5.3 25.2 7.7 24.5 8.2" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
    </header>

    <!-- Intermediate Application Icon Grid: Exactly 15 App Icons -->
    <section class="app-grid-container">
      <div class="app-grid">

        <!-- 1. Weather -->
        <a class="app-item" href="weather.html" data-app-id="weather" data-title="Weather">
          <div class="icon-tile">
            <svg class="app-svg" viewBox="0 0 24 24">
              <path d="M16 16.5a3.8 3.8 0 0 0 .5-7.5 4.8 4.8 0 0 0-9.2-1.2A3.8 3.8 0 0 0 7 16.5z"/>
              <line x1="12" y1="2.5" x2="12" y2="4"/>
              <line x1="18.5" y1="5.2" x2="17.4" y2="6.3"/>
              <line x1="5.5" y1="5.2" x2="6.6" y2="6.3"/>
            </svg>
          </div>
          <span class="app-label">Weather</span>
        </a>

        <!-- 2. Calendar -->
        <a class="app-item" href="calendar.html" data-app-id="calendar" data-title="Calendar">
          <div class="icon-tile">

              <rect x="3.5" y="5" width="17" height="15" rx="3.5"/>
              <line x1="3.5" y1="9.5" x2="20.5" y2="9.5"/>
              <line x1="8" y1="3" x2="8" y2="6"/>
              <line x1="16" y1="3" x2="16" y2="6"/>

              <circle cx="12" cy="16.5" r="0.75"/>

          <span class="app-label">Calendar</span>
        </a>

        <!-- 3. Reminders -->
        <a class="app-item" href="reminders.html" data-app-id="reminders" data-title="Reminders">
          <div class="icon-tile">
            <svg class="app-svg" viewBox="0 0 24 24">
              <circle cx="6" cy="7" r="1.6"/>
              <line x1="10.5" y1="7" x2="19.5" y2="7"/>
              <circle cx="6" cy="12" r="1.6"/>
              <line x1="10.5" y1="12" x2="19.5" y2="12"/>
              <circle cx="6" cy="17" r="1.6"/>
              <line x1="10.5" y1="17" x2="19.5" y2="17"/>

        <!-- 4. Memo (Notes) -->
        <a class="app-item" href="notes.html" data-app-id="notes" data-title="Memo">

            <svg class="app-svg" viewBox="0 0 24 24">
              <path d="M5.5 4.5h8.5l4.5 4.5V19a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2z"/>

              <circle cx="12" cy="12.5" r="8"/>

          </div>

        <!-- 7. Music -->
        <a class="app-item" href="music.html" data-app-id="music" data-title="Music">
          <div class="icon-tile">
            <svg class="app-svg" viewBox="0 0 24 24">
              <circle cx="7.5" cy="16.5" r="2.5"/>
              <circle cx="17.5" cy="14.5" r="2.5"/>
              <path d="M10 16.5V6.8l10-2.2v9.9"/>
              <line x1="10" y1="10.2" x2="20" y2="8"/>

        <!-- 8. Process Record (Workflow Log) -->
        <a class="app-item" href="workflow.html" data-app-id="workflow" data-title="Process record">

            </svg>
          </div>
          <span class="app-label">Process Record</span>
        </a>

        <!-- 9. Academic Record (Academic Notes) -->
        <a class="app-item" href="academic.html" data-app-id="academic" data-title="Academic record">
          <div class="icon-tile">
            <svg class="app-svg" viewBox="0 0 24 24">

          <span class="app-label">Academic Record</span>

            <svg class="app-svg" viewBox="0 0 24 24">
              <line x1="4.5" y1="4.5" x2="19.5" y2="19.5"/>
              <path d="M19.5 4.5l-6.8 7.3"/>

          <span class="app-label">Twitter</span>

        <!-- 11. Settings -->

          <div class="icon-tile">
            <svg class="app-svg" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3"/>

            </svg>

            <svg class="app-svg" viewBox="0 0 24 24">
              <ellipse cx="12" cy="7.2" rx="2.5" ry="3.8"/>
              <ellipse cx="12" cy="16.8" rx="2.5" ry="3.8"/>
              <ellipse cx="7.2" cy="12" rx="3.8" ry="2.5"/>
              <ellipse cx="16.8" cy="12" rx="3.8" ry="2.5"/>

      </div>
    </section>

    <!-- Bottom Resident Dock Bar (4 Shortcuts) -->
    <footer class="dock-container">
      <div class="dock-glass">

  <script>
    /**
     * iOS Liquid Glass Desktop Controller
     */
    document.addEventListener("DOMContentLoaded", () => {
      // Status Bar Clock Sync
      const timeElement = document.getElementById("status-time");
      const syncClock = () => {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, "0");
        const minutes = String(now.getMinutes()).padStart(2, "0");
        timeElement.textContent = `${hours}:${minutes}`;
      };
      syncClock();
      setInterval(syncClock, 1000 * 30);
    });
  </script>
